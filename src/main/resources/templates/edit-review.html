<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Review</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #09090d;
            --surface:   #111118;
            --surface2:  #1a1a24;
            --surface3:  #22222f;
            --border:    rgba(255,255,255,0.06);
            --border2:   rgba(255,255,255,0.1);
            --gold:      #e8b84b;
            --gold-dim:  rgba(232,184,75,0.12);
            --gold-glow: rgba(232,184,75,0.28);
            --text:      #eeeae3;
            --muted:     #7a7890;
            --muted2:    #55536a;
            --danger:    #e05c5c;
            --danger-dim:rgba(224,92,92,0.1);
            --radius:    16px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── TOPNAV ── */
        .topnav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            height: 60px;
            background: rgba(9,9,13,0.85);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }
        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gold);
            text-decoration: none;
        }
        .nav-logo span { color: var(--text); font-weight: 400; }
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.83rem;
            font-weight: 400;
            transition: color 0.2s;
        }
        .nav-back:hover { color: var(--text); }
        .nav-back svg { transition: transform 0.2s; }
        .nav-back:hover svg { transform: translateX(-3px); }

        /* ── PAGE BODY ── */
        .page-body {
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            position: relative;
        }
        .page-body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 50% 0%, rgba(232,184,75,0.06) 0%, transparent 65%),
                radial-gradient(ellipse 40% 30% at 90% 90%, rgba(139,108,239,0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        /* ── PANEL ── */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.25rem 2.5rem;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 16px 60px rgba(0,0,0,0.5);
            animation: fadeUp 0.55s ease both;
            position: relative;
        }

        /* gold top accent line */
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 2rem; right: 2rem;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            border-radius: 99px;
        }

        .panel-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--gold-dim);
            border: 1px solid rgba(232,184,75,0.2);
            border-radius: 99px;
            padding: 4px 12px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .panel-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 0.4rem;
        }
        .panel-title em { font-style: italic; color: var(--gold); }

        .panel-sub {
            color: var(--muted);
            font-size: 0.88rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        /* ── FORM ── */
        .form-group { margin-bottom: 1.25rem; }
        .form-label {
            display: block;
            font-size: 0.73rem;
            font-weight: 500;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 7px;
        }
        input[type="text"], textarea {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-dim);
        }
        input::placeholder, textarea::placeholder { color: var(--muted2); }
        textarea { resize: vertical; min-height: 110px; }

        /* STAR PICKER */
        .star-picker {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 2px;
            margin-top: 4px;
        }
        .star-picker input[type="radio"] { display: none; }
        .star-picker label {
            font-size: 2.1rem;
            cursor: pointer;
            color: var(--surface3);
            transition: color 0.12s, transform 0.12s;
            line-height: 1;
            display: block;
        }
        .star-picker label:hover,
        .star-picker label:hover ~ label,
        .star-picker input[type="radio"]:checked ~ label {
            color: var(--gold);
            transform: scale(1.18);
        }

        /* ── ACTIONS ── */
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 1.75rem;
        }
        .btn-update {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--gold);
            color: #09090d;
            border: none;
            border-radius: 10px;
            padding: 0.82rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 0.92rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px var(--gold-glow);
        }
        .btn-update:hover { opacity: 0.88; transform: translateY(-2px); box-shadow: 0 7px 26px var(--gold-glow); }
        .btn-update:active { transform: translateY(0); }

        .btn-cancel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            background: var(--surface2);
            color: var(--muted);
            border: 1px solid var(--border2);
            border-radius: 10px;
            padding: 0.82rem 1.4rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            font-weight: 400;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        .btn-cancel:hover { color: var(--text); border-color: rgba(255,255,255,0.18); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- TOP NAV -->
<nav class="topnav">
    <a href="/reviews" class="nav-logo">Vendor<span>Reviews</span></a>
    <a href="/reviews" class="nav-back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Back to Reviews
    </a>
</nav>

<!-- PAGE BODY -->
<div class="page-body">
    <div class="panel">

        <div class="panel-eyebrow">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Editing Review
        </div>

        <div class="panel-title">Update your <em>review</em></div>
        <p class="panel-sub">Make changes below and save to update this vendor review.</p>

        <form th:action="@{/updateReview}" method="post" id="editForm">
            <input type="hidden" name="id" th:value="${review.id}"/>

            <div class="form-group">
                <label class="form-label" for="vendor">Vendor Name</label>
                <input type="text" id="vendor" name="vendor"
                       th:value="${review.vendor}"
                       placeholder="Vendor name" required>
            </div>

            <div class="form-group">
                <label class="form-label">Rating</label>
                <div class="star-picker">
                    <input type="radio" name="ratingVisual" id="s5" value="5" th:checked="${review.rating == 5}">
                    <label for="s5">★</label>
                    <input type="radio" name="ratingVisual" id="s4" value="4" th:checked="${review.rating == 4}">
                    <label for="s4">★</label>
                    <input type="radio" name="ratingVisual" id="s3" value="3" th:checked="${review.rating == 3}">
                    <label for="s3">★</label>
                    <input type="radio" name="ratingVisual" id="s2" value="2" th:checked="${review.rating == 2}">
                    <label for="s2">★</label>
                    <input type="radio" name="ratingVisual" id="s1" value="1" th:checked="${review.rating == 1}">
                    <label for="s1">★</label>
                </div>
                <input type="hidden" id="rating-value" name="rating" th:value="${review.rating}">
            </div>

            <div class="form-group">
                <label class="form-label" for="comment">Review</label>
                <textarea id="comment" name="comment"
                          placeholder="Your experience with this vendor..."
                          required th:text="${review.comment}"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-update">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    Save Changes
                </button>
                <a href="/reviews" class="btn-cancel">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</div>

<script>
    // Sync star clicks to hidden input
    document.querySelectorAll('input[name="ratingVisual"]').forEach(radio => {
        radio.addEventListener('change', () => {
            document.getElementById('rating-value').value = radio.value;
        });
    });

    // Validate on submit
    document.getElementById('editForm').addEventListener('submit', e => {
        if (!document.getElementById('rating-value').value) {
            e.preventDefault();
            alert('Please select a star rating.');
        }
    });
</script>

</body>
</html>
