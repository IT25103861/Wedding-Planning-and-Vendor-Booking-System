<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Packages | Ethereal Weddings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="sidebar-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-font sidebar-logo">Ethereal</h1>
                <span style="font-size: 0.7rem; color: var(--primary); letter-spacing: 2px;">VENDOR PORTAL</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-item" data-page="dashboard">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="packages.html" class="sidebar-item active" data-page="packages">
                    <i class="fas fa-boxes"></i> My Packages
                </a>
                <a href="bookings.html" class="sidebar-item" data-page="bookings">
                    <i class="fas fa-calendar-check"></i> Bookings
                </a>
                <a href="notifications.html" class="sidebar-item" data-page="notifications" style="display: flex; align-items: center;">
                    <i class="fas fa-bell"></i> Notifications
                    <span id="notifBadge" class="badge" style="background: var(--danger); color: #fff; margin-left: auto; display: none; padding: 0.2rem 0.5rem; font-size: 0.7rem; border-radius: 10px;">0</span>
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="#" onclick="logout()" class="sidebar-item" style="color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2 class="brand-font">My Packages</h2>
                <button id="addPkgBtn" class="btn btn-primary" style="display: none;">
                    <i class="fas fa-plus"></i> Add Package
                </button>
            </header>

            <div class="card">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Duration/Count</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="packagesTable">
                            <!-- Data injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Package Modal -->
    <div class="modal-overlay" id="packageModal">
        <div class="modal-card">
            <h3 class="brand-font mb-2" id="modalTitle">Add New Package</h3>
            <form id="packageForm">
                <div class="form-group">
                    <label class="form-label">Package Title</label>
                    <input type="text" id="pkgTitle" class="form-control" placeholder="e.g. Premium Floral Decor" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="pkgCategory" class="form-control" required>
                        <!-- Categories injected here -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="pkgDesc" class="form-control" rows="3" placeholder="Describe your service in detail..." required></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Price (LKR)</label>
                        <input type="number" id="pkgPrice" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Duration/Count</label>
                        <input type="text" id="pkgDuration" class="form-control" placeholder="e.g. 4 hours / Per Plate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Package Photos (Up to 3)</label>
                    <input type="file" id="pkgPhotos" class="form-control" accept="image/*" multiple>
                    <small class="text-muted" style="font-size: 0.75rem;">Hold Ctrl or Shift to select up to 3 gorgeous photos.</small>
                </div>
                <div class="form-group">
                    <label class="form-label">Availability</label>
                    <select id="pkgAvailability" class="form-control">
                        <option value="AVAILABLE">Available</option>
                        <option value="UNAVAILABLE">Unavailable</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Package</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const user = requireAuth(['VENDOR']);
        const packageModal = document.getElementById('packageModal');
        const packageForm = document.getElementById('packageForm');
        let categories = [];
        let editingPkgId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            showLoader();
            try {
                // Check approval status
                const vendor = await api.get(`/vendors/${user.id}`);
                if (vendor.status === 'APPROVED') {
                    document.getElementById('addPkgBtn').style.display = 'block';
                }

                // Load categories for modal
                categories = await api.get('/categories');
                const catSelect = document.getElementById('pkgCategory');
                categories.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.categoryId;
                    opt.text = c.categoryName;
                    catSelect.add(opt);
                });

                // Fetch bookings to sync notification badge
                try {
                    const bookings = await api.get(`/bookings/vendor/${user.id}`);
                    const newRequestsCount = bookings.filter(b => b.vendorStatus === 'PENDING').length;
                    const badge = document.getElementById('notifBadge');
                    if (newRequestsCount > 0) {
                        badge.innerText = newRequestsCount;
                        badge.style.display = 'inline-block';
                    } else {
                        badge.style.display = 'none';
                    }
                } catch (e) {
                    console.error('Failed to load notifications count in sidebar', e);
                }

                await loadMyPackages();
            } catch (e) {
                showToast('Initialization failed', 'error');
            } finally {
                hideLoader();
            }
        });

        async function loadMyPackages() {
            try {
                const allPkgs = await api.get('/packages');
                const myPkgs = allPkgs.filter(p => p.vendorId === user.id);
                renderPackages(myPkgs);
            } catch (e) { showToast('Failed to load packages', 'error'); }
        }

        function renderPackages(pkgs) {
            const tableBody = document.getElementById('packagesTable');
            if (pkgs.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No packages found. Click "Add Package" to start.</td></tr>';
                return;
            }

            tableBody.innerHTML = pkgs.map(p => {
                const category = categories.find(c => c.categoryId === p.categoryId);
                const isAvail = p.availability === 'AVAILABLE';
                const btnStyle = isAvail 
                    ? 'background: rgb(232, 245, 233); color: rgb(46, 125, 50); border: 1px solid rgb(46, 125, 50);' 
                    : 'background: rgb(255, 235, 238); color: rgb(211, 47, 47); border: 1px solid rgb(211, 47, 47);';

                // LocalStorage image mapping
                const localImg = localStorage.getItem(`pkg_image_${p.packageId}_1`);
                const defaultImg = `../assets/images/packages/pkg_${p.packageId}_1.jpg`;
                const finalImg = localImg || defaultImg;

                return `
                <tr>
                    <td>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <img src="${finalImg}" onerror="this.src='../assets/images/placeholder.jpg'" style="width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border);" />
                            <div style="font-weight: 600;">${p.title}</div>
                        </div>
                    </td>
                    <td>${category ? category.categoryName : 'General'}</td>
                    <td>${formatLKR(p.price)}</td>
                    <td>${p.duration}</td>
                    <td>
                        <button onclick="togglePackageAvailability(${p.packageId}, '${p.availability}')" 
                                class="btn" 
                                style="padding: 0.4rem 1rem; font-weight: 700; letter-spacing: 1px; font-size: 0.75rem; border-radius: 20px; ${btnStyle}">
                            ${p.availability}
                        </button>
                    </td>
                    <td>
                        <div style="display: flex; gap: 0.5rem;">
                            <button onclick='openEditModal(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="btn btn-outline" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">Edit</button>
                            <button onclick="deletePackage(${p.packageId})" class="btn btn-outline" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; color: var(--danger); border-color: var(--danger);">Delete</button>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        async function togglePackageAvailability(id, currentStatus) {
            const newStatus = currentStatus === 'AVAILABLE' ? 'UNAVAILABLE' : 'AVAILABLE';
            confirmModal(`Are you sure you want to make this package ${newStatus.toLowerCase()}?`, async () => {
                try {
                    showLoader();
                    await api.request('PATCH', `/packages/${id}/availability?status=${newStatus}`);
                    showToast(`Package is now ${newStatus.toLowerCase()}`, 'success');
                    loadMyPackages();
                } catch (e) {
                    showToast('Failed to update availability', 'error');
                } finally {
                    hideLoader();
                }
            });
        }

        document.getElementById('addPkgBtn').onclick = () => {
            editingPkgId = null;
            packageForm.reset();
            document.getElementById('modalTitle').innerText = 'Add New Package';
            packageModal.style.display = 'flex';
        };

        function openEditModal(pkg) {
            editingPkgId = pkg.packageId;
            document.getElementById('modalTitle').innerText = 'Edit Package';
            document.getElementById('pkgTitle').value = pkg.title;
            document.getElementById('pkgCategory').value = pkg.categoryId;
            document.getElementById('pkgDesc').value = pkg.description;
            document.getElementById('pkgPrice').value = pkg.price;
            document.getElementById('pkgDuration').value = pkg.duration;
            document.getElementById('pkgAvailability').value = pkg.availability;
            packageModal.style.display = 'flex';
        }

        function closeModal() {
            packageModal.style.display = 'none';
        }

        packageForm.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            utils.setLoading(btn, true, 'Saving...');

            const payload = {
                vendorId: user.id,
                categoryId: document.getElementById('pkgCategory').value,
                title: document.getElementById('pkgTitle').value,
                description: document.getElementById('pkgDesc').value,
                price: document.getElementById('pkgPrice').value,
                duration: document.getElementById('pkgDuration').value,
                availability: document.getElementById('pkgAvailability').value
            };

            try {
                let response;
                if (editingPkgId) {
                    response = await api.put(`/packages/${editingPkgId}`, payload);
                    showToast('Package updated!', 'success');
                } else {
                    response = await api.post('/packages', payload);
                    showToast('Package created!', 'success');
                }

                // If images were selected, read up to 3 and save to localStorage!
                const fileInput = document.getElementById('pkgPhotos');
                const finalId = editingPkgId || (response ? response.packageId : null);
                if (finalId && fileInput.files.length > 0) {
                    const files = Array.from(fileInput.files).slice(0, 3);
                    files.forEach((file, index) => {
                        const reader = new FileReader();
                        reader.onload = function(evt) {
                            localStorage.setItem(`pkg_image_${finalId}_${index + 1}`, evt.target.result);
                            if (index === files.length - 1) {
                                loadMyPackages(); // Reload table after all files are processed
                            }
                        };
                        reader.readAsDataURL(file);
                    });
                }

                closeModal();
                loadMyPackages();
            } catch (err) {
                showToast(err.message || 'Operation failed', 'error');
            } finally {
                utils.setLoading(btn, false, 'Save Package');
            }
        };

        async function deletePackage(id) {
            confirmModal('Are you sure you want to delete this package?', async () => {
                showLoader();
                try {
                    await api.delete(`/packages/${id}`);
                    showToast('Package deleted', 'success');
                    loadMyPackages();
                } catch (e) { showToast('Failed to delete package', 'error'); }
                finally { hideLoader(); }
            });
        }
    </script>
</body>
</html>
