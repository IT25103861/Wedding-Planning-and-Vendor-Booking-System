<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Events | Ethereal Weddings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .event-header-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(183, 147, 94, 0.2);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .event-header-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(183, 147, 94, 0.3);
        }

        .event-header-card::after {
            content: '\f140';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            position: absolute;
            right: -20px;
            bottom: -20px;
            font-size: 10rem;
            opacity: 0.1;
            transform: rotate(-15deg);
        }

        .budget-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            color: #fff;
        }
        
        .event-header-card .badge {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-status {
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="sidebar-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-font sidebar-logo">Ethereal</h1>
                <span style="font-size: 0.7rem; color: var(--primary); letter-spacing: 2px;">CUSTOMER PORTAL</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-item" data-page="dashboard">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="events.html" class="sidebar-item active" data-page="events">
                    <i class="fas fa-calendar-alt"></i> My Events
                </a>
                <a href="packages.html" class="sidebar-item" data-page="packages">
                    <i class="fas fa-box-open"></i> Browse Packages
                </a>
                <a href="bookings.html" class="sidebar-item" data-page="bookings">
                    <i class="fas fa-clipboard-list"></i> My Bookings
                </a>
                <a href="payments.html" class="sidebar-item" data-page="payments">
                    <i class="fas fa-wallet"></i> My Payments
                </a>
                <a href="notifications.html" class="sidebar-item" data-page="notifications">
                    <i class="fas fa-bell"></i> Notifications
                </a>
                <a href="reviews.html" class="sidebar-item" data-page="reviews">
                    <i class="fas fa-star"></i> My Reviews
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="#" onclick="logout()" class="sidebar-item" style="color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2 class="brand-font">My Events</h2>
                <button id="addEventBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Plan New Event
                </button>
            </header>

            <div id="eventsGrid"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
                <!-- Event cards will be injected here -->
            </div>
        </main>
    </div>

    <!-- Add Event Modal -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal-card">
            <h3 class="brand-font mb-2" id="modalTitle">Plan New Event</h3>
            <form id="eventForm">
                <div class="form-group">
                    <label class="form-label">Event Name</label>
                    <input type="text" id="eventName" class="form-control" placeholder="e.g. Dream Wedding Reception"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Event Date</label>
                    <input type="date" id="eventDate" class="form-control" required>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js?v=2"></script>
    <script>
        const user = requireAuth(['CUSTOMER']);
        const eventModal = document.getElementById('eventModal');
        const eventForm = document.getElementById('eventForm');
        let events = [];

        document.addEventListener('DOMContentLoaded', loadEvents);

        async function loadEvents() {
            showLoader();
            try {
                // Fetch customer events
                events = await api.get(`/events/customer/${user.id}`);
                
                // Fetch customer bookings to map total costs
                let bookings = [];
                try {
                    bookings = await api.get(`/bookings/customer/${user.id}`);
                } catch (bErr) {
                    console.error("Failed to load bookings for cost mapping", bErr);
                }
                
                // Map booking total cost to each event
                events.forEach(e => {
                    const booking = bookings.find(b => b.eventId === e.eventId);
                    e.totalCost = booking ? (booking.totalCost || 0) : 0;
                });

                renderEvents();
            } catch (error) {
                showToast('Failed to load events', 'error');
            } finally {
                hideLoader();
            }
        }

        function renderEvents() {
            const grid = document.getElementById('eventsGrid');
            if (events.length === 0) {
                grid.innerHTML = '<div class="card text-center" style="grid-column: 1/-1;"><p class="text-muted">You haven\'t planned any events yet. Click "Plan New Event" to start!</p></div>';
                return;
            }

            grid.innerHTML = events.map(e => {
                const isConfirmed = e.status === 'PENDING_APPROVAL' || e.status === 'CONFIRMED' || e.status === 'REJECTED';
                const buttonText = isConfirmed ? 'View Inventory' : 'Find Packages';
                const buttonIcon = isConfirmed ? 'fa-eye' : 'fa-search';
                const targetUrl = isConfirmed ? `event-details.html?eventId=${e.eventId}` : `packages.html?eventId=${e.eventId}`;
                
                // Format total cost nicely
                const formattedCost = new Intl.NumberFormat('en-LK', {
                    style: 'currency',
                    currency: 'LKR',
                    minimumFractionDigits: 2
                }).format(e.totalCost || 0).replace('LKR', 'LKR\u00A0');

                // Custom status badge matching the design
                let statusBadgeHtml = '';
                if (e.status === 'CONFIRMED') {
                    statusBadgeHtml = `
                        <div class="badge-status" style="background: #e6f4ea; color: #137333; padding: 0.6rem 1.2rem; border-radius: 50px;">
                            <i class="fas fa-check-circle"></i> CONFIRMED
                        </div>
                    `;
                } else if (e.status === 'PENDING_APPROVAL') {
                    statusBadgeHtml = `
                        <div class="badge-status" style="background: #fef7e0; color: #b06000; padding: 0.6rem 1.2rem; border-radius: 50px;">
                            <i class="fas fa-clock"></i> PENDING
                        </div>
                    `;
                } else if (e.status === 'REJECTED') {
                    statusBadgeHtml = `
                        <div class="badge-status" style="background: #fef7e0; color: #b06000; padding: 0.6rem 1.2rem; border-radius: 50px;">
                            <i class="fas fa-clock"></i> PENDING
                        </div>
                    `;
                } else if (e.status === 'DELETED') {
                    statusBadgeHtml = `
                        <div class="badge-status" style="background: #f1f3f4; color: #5f6368; padding: 0.6rem 1.2rem; border-radius: 50px;">
                            <i class="fas fa-trash-alt"></i> DELETED
                        </div>
                    `;
                } else {
                    statusBadgeHtml = `
                        <div class="badge-status" style="background: rgba(255, 255, 255, 0.25); color: #fff; padding: 0.6rem 1.2rem; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.3);">
                            <i class="fas fa-edit"></i> PLANNING
                        </div>
                    `;
                }

                return `
                <div class="event-header-card" style="display: flex; flex-direction: column; justify-content: space-between; min-height: 280px;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
                        <div style="flex: 1;">
                            <span class="badge" style="background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 600;">${e.eventType || 'Wedding'}</span>
                            <h2 class="brand-font" style="font-size: 1.8rem; margin: 1rem 0 0.5rem 0; color: #fff; line-height: 1.2;">${e.eventName}</h2>
                            <div style="font-size: 0.95rem; opacity: 0.9; margin-top: 0.8rem; display: flex; flex-direction: column; gap: 0.4rem;">
                                <span>
                                    <i class="fas fa-calendar-day"></i> ${formatDate(e.eventDate)}
                                </span>
                                <span style="display: inline-flex; align-items: center; gap: 0.4rem;">
                                    <i class="fas fa-map-marker-alt"></i> ${e.location || 'Not Set'}
                                </span>
                            </div>
                        </div>
                        <div style="text-align: right; display: flex; flex-direction: column; gap: 0.8rem; align-items: flex-end;">
                            <button onclick="deleteEvent(${e.eventId})" class="btn" style="color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.15); border: none; padding: 0.5rem; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; margin-bottom: 0.2rem;" onmouseover="this.style.background='rgba(220,53,69,0.8)'" onmouseout="this.style.background='rgba(0,0,0,0.15)'">
                                <i class="fas fa-trash" style="font-size: 0.85rem;"></i>
                            </button>
                            <div class="budget-badge" style="font-size: 0.95rem; padding: 0.5rem 1rem;">
                                <i class="fas fa-wallet"></i> ${formattedCost}
                            </div>
                            ${statusBadgeHtml}
                        </div>
                    </div>
                    <div style="margin-top: 1.5rem; position: relative; z-index: 2;">
                        <button onclick="window.location.href='${targetUrl}'" class="btn" style="width: 100%; padding: 0.8rem; border-radius: 50px; font-weight: 700; background: #fff; color: var(--primary); border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(0,0,0,0.15)';" onmouseout="this.style.transform='none'; this.style.boxShadow='0 4px 15px rgba(0,0,0,0.1)';">
                            <i class="fas ${buttonIcon}"></i> ${buttonText}
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        document.getElementById('addEventBtn').onclick = () => {
            eventForm.reset();
            document.getElementById('modalTitle').innerText = 'Plan New Event';
            // Set min date to today
            document.getElementById('eventDate').min = new Date().toISOString().split('T')[0];
            eventModal.style.display = 'flex';
        };

        function closeModal() {
            eventModal.style.display = 'none';
        }

        eventForm.onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            utils.setLoading(saveBtn, true, 'Saving...');

            const payload = {
                customerId: user.id,
                eventName: document.getElementById('eventName').value,
                eventType: 'Wedding',
                eventDate: document.getElementById('eventDate').value
            };

            try {
                await api.post('/events', payload);
                showToast('Event created successfully!', 'success');
                closeModal();
                loadEvents();
            } catch (error) {
                showToast(error.message || 'Failed to save event', 'error');
            } finally {
                utils.setLoading(saveBtn, false, 'Save Event');
            }
        };

        async function deleteEvent(id) {
            confirmModal('Are you sure you want to delete this event? This will cancel all bookings and refund your payments.', async () => {
                showLoader();
                try {
                    await api.delete(`/events/${id}`);
                    showToast('Event deleted and payments refunded', 'success');
                    loadEvents();
                } catch (error) {
                    showToast('Failed to delete event', 'error');
                } finally {
                    hideLoader();
                }
            });
        }
    </script>
</body>

</html>
