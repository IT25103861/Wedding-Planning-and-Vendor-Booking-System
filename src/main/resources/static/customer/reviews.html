<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reviews | Ethereal Weddings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .review-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }
        .review-card {
            background: #fff;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
            border: 1px solid #f0e8dc;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .review-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(183,147,94,0.15);
        }
        .review-card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .review-pkg-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #b7935e22, #b7935e44);
            color: var(--primary, #b7935e);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }
        .review-pkg-name { font-weight: 700; font-size: 0.95rem; color: #1a1a2e; line-height: 1.3; }
        .review-pkg-sub { font-size: 0.75rem; color: #999; margin-top: 0.1rem; }
        .star-row { display: flex; gap: 3px; align-items: center; }
        .star-row i { font-size: 1rem; color: #e0e0e0; }
        .star-row i.filled { color: #f4b942; }
        .review-comment {
            font-size: 0.9rem; color: #555; line-height: 1.6; font-style: italic;
            background: #fafafa;
            border-left: 3px solid var(--primary, #b7935e);
            padding: 0.6rem 0.9rem;
            border-radius: 0 8px 8px 0;
        }
        .review-meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.75rem; color: #aaa;
        }
        .review-actions {
            display: flex; gap: 0.6rem; padding-top: 0.5rem;
            border-top: 1px solid #f0e8dc; margin-top: auto;
        }
        .btn-review-edit {
            flex: 1; padding: 0.45rem; border-radius: 8px; border: 1px solid #b7935e;
            background: #fff; color: #b7935e; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
        }
        .btn-review-edit:hover { background: #b7935e; color: #fff; }
        .btn-review-delete {
            flex: 1; padding: 0.45rem; border-radius: 8px; border: 1px solid #ef4444;
            background: #fff; color: #ef4444; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
        }
        .btn-review-delete:hover { background: #ef4444; color: #fff; }
        .empty-state { text-align: center; padding: 4rem 2rem; color: #aaa; grid-column: 1/-1; }
        .empty-state i { font-size: 3.5rem; margin-bottom: 1rem; color: #e0d5c7; display: block; }
        .empty-state h3 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #999; }
        .reviews-count-badge {
            background: linear-gradient(135deg, #b7935e, #7a5c30);
            color: #fff; font-size: 0.75rem; font-weight: 700;
            padding: 0.25rem 0.75rem; border-radius: 20px; letter-spacing: 0.5px;
        }
        .avg-rating-card {
            background: linear-gradient(135deg, #b7935e, #7a5c30);
            color: #fff; border-radius: 16px; padding: 1.2rem 2rem;
            display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem;
        }
        .avg-number { font-size: 3rem; font-weight: 800; line-height: 1; }
        .avg-stars i { color: rgba(255,255,255,0.4); font-size: 1.1rem; }
        .avg-stars i.filled { color: #ffe066; }
        .avg-label { font-size: 0.85rem; opacity: 0.8; margin-top: 0.2rem; }

        /* Edit Modal */
        .edit-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .edit-modal-card {
            background: #fff; border-radius: 18px; padding: 2rem 2.2rem;
            width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .edit-modal-title {
            font-size: 1.15rem; font-weight: 700; margin-bottom: 1.5rem;
            padding-bottom: 1rem; border-bottom: 1px solid #eee; color: #1a1a2e;
        }
        .star-picker { display: flex; gap: 6px; margin-bottom: 1rem; }
        .star-picker i {
            font-size: 1.6rem; color: #e0e0e0; cursor: pointer;
            transition: color 0.15s, transform 0.15s;
        }
        .star-picker i:hover, .star-picker i.selected { color: #f4b942; transform: scale(1.15); }
        .edit-field-label {
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: #888; display: block; margin-bottom: 0.4rem;
        }
        .edit-textarea {
            width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #ddd;
            border-radius: 8px; font-size: 0.9rem; font-family: inherit;
            resize: vertical; min-height: 100px; box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .edit-textarea:focus { outline: none; border-color: #b7935e; box-shadow: 0 0 0 3px rgba(183,147,94,0.15); }
        .edit-btn-row {
            display: flex; gap: 0.8rem; margin-top: 1.5rem;
            padding-top: 1rem; border-top: 1px solid #eee; justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="sidebar-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-font sidebar-logo">Ethereal</h1>
                <span style="font-size: 0.7rem; color: var(--primary); letter-spacing: 2px;">CUSTOMER PORTAL</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-item" data-page="dashboard"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="events.html" class="sidebar-item" data-page="events"><i class="fas fa-calendar-alt"></i> My Events</a>
                <a href="packages.html" class="sidebar-item" data-page="packages"><i class="fas fa-box-open"></i> Browse Packages</a>
                <a href="bookings.html" class="sidebar-item" data-page="bookings"><i class="fas fa-clipboard-list"></i> My Bookings</a>
                <a href="payments.html" class="sidebar-item" data-page="payments"><i class="fas fa-wallet"></i> My Payments</a>
                <a href="notifications.html" class="sidebar-item" data-page="notifications"><i class="fas fa-bell"></i> Notifications</a>
                <a href="reviews.html" class="sidebar-item active" data-page="reviews"><i class="fas fa-star"></i> My Reviews</a>
            </nav>
            <div onclick="openProfileModal()" style="padding: 1.2rem 1.5rem 0.6rem 1.5rem; display: flex; align-items: center; gap: 0.75rem; border-top: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='transparent'">
                <div style="width: 38px; height: 38px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; flex-shrink: 0;"><span id="sideUserInitial">C</span></div>
                <div style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                    <div id="sideUserName" style="font-weight: 600; font-size: 0.85rem; color: #fff;">Customer Name</div>
                    <div style="font-size: 0.7rem; color: var(--primary); letter-spacing: 1px; margin-top: 0.1rem; text-transform: uppercase;">View Profile</div>
                </div>
            </div>
            <div style="padding: 1rem 1.5rem 1.5rem 1.5rem;">
                <a href="#" onclick="logout()" class="sidebar-item" style="color: var(--danger); padding: 0.5rem 0;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2 class="brand-font">My Reviews</h2>
                <div class="user-profile" onclick="openProfileModal()" style="display: flex; align-items: center; gap: 1rem; cursor: pointer;">
                    <span id="userName" style="font-weight: 600;">Customer</span>
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;"><span id="userInitial">C</span></div>
                </div>
            </header>

            <!-- Average Rating Card -->
            <div id="avgRatingCard" class="avg-rating-card" style="display:none;">
                <div>
                    <div class="avg-number" id="avgRatingNum">0.0</div>
                    <div class="avg-stars" id="avgStars"></div>
                </div>
                <div>
                    <div style="font-size:1rem; font-weight:700;">Average Rating</div>
                    <div class="avg-label" id="avgLabel">0 reviews submitted</div>
                </div>
            </div>

            <!-- Package Reviews Header -->
            <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1.5rem;">
                <h3 class="brand-font" style="margin:0;">Package Reviews</h3>
                <span class="reviews-count-badge" id="reviewCountBadge">0</span>
            </div>
            <div id="reviewsGrid" class="review-grid"></div>

            <!-- Event Reviews Section -->
            <div style="display:flex; align-items:center; gap:0.75rem; margin:2rem 0 1.5rem;">
                <h3 class="brand-font" style="margin:0;">Event Reviews</h3>
                <span class="reviews-count-badge" id="eventReviewCountBadge">0</span>
            </div>
            <div id="eventReviewsGrid" class="review-grid"></div>
        </main>
    </div>

    <!-- ===== EDIT REVIEW MODAL ===== -->
    <div class="edit-modal-overlay" id="editModal" onclick="if(event.target===this) closeEditModal()">
        <div class="edit-modal-card">
            <div class="edit-modal-title"><i class="fas fa-edit" style="color:#b7935e;margin-right:0.5rem;"></i>Edit Review</div>

            <label class="edit-field-label">Your Rating</label>
            <div class="star-picker" id="starPicker">
                <i class="fas fa-star" data-val="1"></i>
                <i class="fas fa-star" data-val="2"></i>
                <i class="fas fa-star" data-val="3"></i>
                <i class="fas fa-star" data-val="4"></i>
                <i class="fas fa-star" data-val="5"></i>
            </div>

            <label class="edit-field-label" style="margin-top:0.5rem;">Comment</label>
            <textarea class="edit-textarea" id="editComment" placeholder="Share your experience..."></textarea>

            <div class="edit-btn-row">
                <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" id="editSaveBtn" onclick="saveEditedReview()">
                    <i class="fas fa-save"></i>&nbsp; Save Changes
                </button>
            </div>
        </div>
    </div>
    <!-- ===== END EDIT MODAL ===== -->

    <!-- ===== EDIT EVENT REVIEW MODAL ===== -->
    <div class="edit-modal-overlay" id="editEventModal" onclick="if(event.target===this) closeEventEditModal()">
        <div class="edit-modal-card">
            <div class="edit-modal-title" style="color:#6366f1;"><i class="fas fa-calendar-check" style="color:#6366f1;margin-right:0.5rem;"></i>Edit Event Review</div>

            <label class="edit-field-label">Your Rating</label>
            <div class="star-picker" id="eventStarPicker">
                <i class="fas fa-star" data-val="1"></i>
                <i class="fas fa-star" data-val="2"></i>
                <i class="fas fa-star" data-val="3"></i>
                <i class="fas fa-star" data-val="4"></i>
                <i class="fas fa-star" data-val="5"></i>
            </div>

            <label class="edit-field-label" style="margin-top:0.5rem;">Comment</label>
            <textarea class="edit-textarea" id="editEventComment" placeholder="Share your overall event experience..."></textarea>

            <div class="edit-btn-row">
                <button class="btn btn-outline" onclick="closeEventEditModal()">Cancel</button>
                <button class="btn btn-primary" id="editEventSaveBtn" onclick="saveEventReview()" style="background:#6366f1;border-color:#6366f1;">
                    <i class="fas fa-save"></i>&nbsp; Save Changes
                </button>
            </div>
        </div>
    </div>
    <!-- ===== END EVENT EDIT MODAL ===== -->

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const user = requireAuth(['CUSTOMER']);

        let allMyReviews = [];
        let allMyEventReviews = [];
        let packageMap = {};
        let editingReviewId = null;
        let editingEventId = null;
        let selectedRating = 0;
        let selectedEventRating = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!user) return;

            document.getElementById('userName').innerText = user.name;
            document.getElementById('userInitial').innerText = user.name.charAt(0);
            if (document.getElementById('sideUserName')) document.getElementById('sideUserName').innerText = user.name;
            if (document.getElementById('sideUserInitial')) document.getElementById('sideUserInitial').innerText = user.name.charAt(0);

            // Wire package review star picker
            document.querySelectorAll('#starPicker i').forEach(star => {
                star.addEventListener('mouseover', () => highlightStars(+star.dataset.val, 'starPicker', selectedRating));
                star.addEventListener('mouseout', () => highlightStars(selectedRating, 'starPicker', selectedRating));
                star.addEventListener('click', () => { selectedRating = +star.dataset.val; highlightStars(selectedRating, 'starPicker', selectedRating); });
            });

            // Wire event review star picker
            document.querySelectorAll('#eventStarPicker i').forEach(star => {
                star.addEventListener('mouseover', () => highlightStars(+star.dataset.val, 'eventStarPicker', selectedEventRating));
                star.addEventListener('mouseout', () => highlightStars(selectedEventRating, 'eventStarPicker', selectedEventRating));
                star.addEventListener('click', () => { selectedEventRating = +star.dataset.val; highlightStars(selectedEventRating, 'eventStarPicker', selectedEventRating); });
            });

            await loadReviews();
        });

        async function loadReviews() {
            showLoader();
            try {
                // Package reviews
                const allReviews = await api.get('/reviews');
                allMyReviews = allReviews.filter(r => r.customerId === user.id);
                document.getElementById('reviewCountBadge').innerText = allMyReviews.length;

                // Package names
                try {
                    const pkgs = await api.get('/packages');
                    pkgs.forEach(p => { packageMap[p.packageId || p.id] = p.title || p.packageTitle || 'Package'; });
                } catch(e) {}

                // Event reviews — customer's events that have a rating
                const events = await api.get(`/events/customer/${user.id}`);
                allMyEventReviews = events.filter(e => e.eventRating != null);
                document.getElementById('eventReviewCountBadge').innerText = allMyEventReviews.length;

                renderReviews();
                renderEventReviews();

            } catch (err) {
                console.error(err);
                showToast('Failed to load reviews', 'error');
            } finally {
                hideLoader();
            }
        }

        // ===== PACKAGE REVIEWS =====
        function renderReviews() {
            const grid = document.getElementById('reviewsGrid');
            if (allMyReviews.length === 0) {
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><h3>No package reviews yet</h3><p>Leave a review after your event experience.</p></div>`;
                document.getElementById('avgRatingCard').style.display = 'none';
                return;
            }
            const rated = allMyReviews.filter(r => r.packageRating != null);
            if (rated.length > 0) {
                const avg = rated.reduce((s, r) => s + r.packageRating, 0) / rated.length;
                document.getElementById('avgRatingNum').innerText = avg.toFixed(1);
                document.getElementById('avgStars').innerHTML = starsHTML(Math.round(avg));
                document.getElementById('avgLabel').innerText = `${allMyReviews.length} review${allMyReviews.length !== 1 ? 's' : ''} submitted`;
                document.getElementById('avgRatingCard').style.display = 'flex';
            }
            const sorted = [...allMyReviews].sort((a, b) => new Date(b.createdAt || b.reviewedAt || 0) - new Date(a.createdAt || a.reviewedAt || 0));
            grid.innerHTML = sorted.map(r => {
                const pkgName = packageMap[r.packageId] || `Package #${r.packageId}`;
                const rating = r.packageRating || 0;
                const comment = r.packageComment || '';
                const dateStr = r.reviewedAt || r.createdAt;
                const displayDate = dateStr ? new Date(dateStr).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
                return `
                    <div class="review-card" id="review-card-${r.reviewId}">
                        <div class="review-card-header">
                            <div class="review-pkg-icon"><i class="fas fa-box-open"></i></div>
                            <div>
                                <div class="review-pkg-name">${pkgName}</div>
                                <div class="review-pkg-sub">Package #${r.packageId}${r.eventId ? ' &nbsp;|&nbsp; Event #' + r.eventId : ''}</div>
                            </div>
                        </div>
                        <div class="star-row">${starsHTML(rating)}<span style="font-size:0.8rem;color:#888;margin-left:6px;font-weight:600;">${rating}/5</span></div>
                        ${comment ? `<div class="review-comment">"${comment}"</div>` : `<div class="review-comment" style="color:#bbb;font-style:italic;">No comment left.</div>`}
                        <div class="review-meta">
                            <span><i class="fas fa-calendar-alt" style="margin-right:4px;"></i>${displayDate}</span>
                            <span style="background:#f0e8dc;color:#b7935e;padding:0.15rem 0.6rem;border-radius:20px;font-weight:600;">Review #${r.reviewId}</span>
                        </div>
                        <div class="review-actions">
                            <button class="btn-review-edit" onclick="openEditModal(${r.reviewId})"><i class="fas fa-edit"></i>&nbsp; Edit</button>
                            <button class="btn-review-delete" onclick="deleteReview(${r.reviewId})"><i class="fas fa-trash-alt"></i>&nbsp; Delete</button>
                        </div>
                    </div>`;
            }).join('');
        }

        // ===== EVENT REVIEWS =====
        function renderEventReviews() {
            const grid = document.getElementById('eventReviewsGrid');
            if (allMyEventReviews.length === 0) {
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-check"></i><h3>No event reviews yet</h3><p>Overall event reviews will appear here after you submit them.</p></div>`;
                return;
            }
            grid.innerHTML = allMyEventReviews.map(ev => {
                const rating = ev.eventRating || 0;
                const comment = ev.eventReview || '';
                const dateStr = ev.reviewedAt;
                const displayDate = dateStr ? new Date(dateStr).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
                return `
                    <div class="review-card" id="event-review-card-${ev.eventId}">
                        <div class="review-card-header">
                            <div class="review-pkg-icon" style="background:linear-gradient(135deg,#6366f122,#6366f144);color:#6366f1;"><i class="fas fa-calendar-star"></i></div>
                            <div>
                                <div class="review-pkg-name">${ev.eventName || 'Event'}</div>
                                <div class="review-pkg-sub">Event #${ev.eventId} &nbsp;|&nbsp; ${ev.eventType || ''}</div>
                            </div>
                        </div>
                        <div class="star-row">${starsHTML(rating)}<span style="font-size:0.8rem;color:#888;margin-left:6px;font-weight:600;">${rating}/5</span></div>
                        ${comment ? `<div class="review-comment">"${comment}"</div>` : `<div class="review-comment" style="color:#bbb;font-style:italic;">No comment left.</div>`}
                        <div class="review-meta">
                            <span><i class="fas fa-calendar-alt" style="margin-right:4px;"></i>${displayDate || ev.eventDate || ''}</span>
                            <span style="background:#ede9fe;color:#6366f1;padding:0.15rem 0.6rem;border-radius:20px;font-weight:600;">Event Review</span>
                        </div>
                        <div class="review-actions">
                            <button class="btn-review-edit" style="border-color:#6366f1;color:#6366f1;" onmouseover="this.style.background='#6366f1';this.style.color='#fff'" onmouseout="this.style.background='#fff';this.style.color='#6366f1'" onclick="openEventEditModal(${ev.eventId}, ${rating}, '${(comment).replace(/'/g,'\\&#39;')}')">
                                <i class="fas fa-edit"></i>&nbsp; Edit
                            </button>
                        </div>
                    </div>`;
            }).join('');
        }

        // ===== STAR HELPERS =====
        function starsHTML(rating) {
            let html = '';
            for (let i = 1; i <= 5; i++) html += `<i class="fas fa-star ${i <= rating ? 'filled' : ''}"></i>`;
            return html;
        }

        function highlightStars(n, pickerId, current) {
            document.querySelectorAll(`#${pickerId} i`).forEach(s => s.classList.toggle('selected', +s.dataset.val <= n));
        }

        // ===== PACKAGE REVIEW EDIT =====
        function openEditModal(reviewId) {
            const review = allMyReviews.find(r => r.reviewId === reviewId);
            if (!review) return;
            editingReviewId = reviewId;
            selectedRating = review.packageRating || 0;
            document.getElementById('editComment').value = review.packageComment || '';
            highlightStars(selectedRating, 'starPicker', selectedRating);
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            editingReviewId = null; selectedRating = 0;
        }

        async function saveEditedReview() {
            if (!editingReviewId || selectedRating === 0) { showToast('Please select a star rating', 'error'); return; }
            const btn = document.getElementById('editSaveBtn');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>&nbsp; Saving...';
            try {
                const updated = await api.put(`/reviews/${editingReviewId}`, { packageRating: selectedRating, packageComment: document.getElementById('editComment').value.trim() });
                const idx = allMyReviews.findIndex(r => r.reviewId === editingReviewId);
                if (idx !== -1) { allMyReviews[idx].packageRating = updated.packageRating; allMyReviews[idx].packageComment = updated.packageComment; }
                closeEditModal(); renderReviews();
                showToast('Package review updated!', 'success');
            } catch (e) { showToast(e.message || 'Failed to update', 'error'); }
            finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i>&nbsp; Save Changes'; }
        }

        // ===== EVENT REVIEW EDIT =====
        function openEventEditModal(eventId, rating, comment) {
            editingEventId = eventId;
            selectedEventRating = rating || 0;
            document.getElementById('editEventComment').value = comment || '';
            highlightStars(selectedEventRating, 'eventStarPicker', selectedEventRating);
            document.getElementById('editEventModal').style.display = 'flex';
        }

        function closeEventEditModal() {
            document.getElementById('editEventModal').style.display = 'none';
            editingEventId = null; selectedEventRating = 0;
        }

        async function saveEventReview() {
            if (!editingEventId || selectedEventRating === 0) { showToast('Please select a star rating', 'error'); return; }
            const btn = document.getElementById('editEventSaveBtn');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>&nbsp; Saving...';
            try {
                await api.request('PUT', `/events/${editingEventId}/review?rating=${selectedEventRating}&review=${encodeURIComponent(document.getElementById('editEventComment').value.trim())}`);
                const idx = allMyEventReviews.findIndex(e => e.eventId === editingEventId);
                if (idx !== -1) { allMyEventReviews[idx].eventRating = selectedEventRating; allMyEventReviews[idx].eventReview = document.getElementById('editEventComment').value.trim(); }
                closeEventEditModal(); renderEventReviews();
                showToast('Event review updated!', 'success');
            } catch (e) { showToast(e.message || 'Failed to update event review', 'error'); }
            finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i>&nbsp; Save Changes'; }
        }

        // ===== DELETE PACKAGE REVIEW =====
        async function deleteReview(reviewId) {
            confirmModal('Are you sure you want to delete this review? This cannot be undone.', async () => {
                showLoader();
                try {
                    await api.delete(`/reviews/${reviewId}`);
                    allMyReviews = allMyReviews.filter(r => r.reviewId !== reviewId);
                    document.getElementById('reviewCountBadge').innerText = allMyReviews.length;
                    renderReviews();
                    showToast('Review deleted successfully', 'success');
                } catch (e) { showToast(e.message || 'Failed to delete review', 'error'); }
                finally { hideLoader(); }
            });
        }
    </script>
</body>
</html>
