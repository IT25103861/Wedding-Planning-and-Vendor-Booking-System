<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | Ethereal Weddings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .review-card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: 1.8rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
        }
        .review-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        .star-rating-static {
            color: #ffd700;
            display: flex;
            gap: 3px;
            margin-bottom: 0.8rem;
        }
        .star-rating .star {
            font-size: 2rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
            margin-right: 0.25rem;
        }
        .star-rating .star.active {
            color: #ffd700;
        }
        .review-meta {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 1rem;
            border-top: 1px solid var(--border);
            padding-top: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .review-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }
        .select-wrapper {
            position: relative;
        }
        .select-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="sidebar-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-font sidebar-logo">Ethereal</h1>
                <span style="font-size: 0.7rem; color: var(--primary); letter-spacing: 2px;">CUSTOMER PORTAL</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-item" data-page="dashboard">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="events.html" class="sidebar-item" data-page="events">
                    <i class="fas fa-calendar-alt"></i> My Events
                </a>
                <a href="packages.html" class="sidebar-item" data-page="packages">
                    <i class="fas fa-box-open"></i> Browse Packages
                </a>
                <a href="bookings.html" class="sidebar-item" data-page="bookings">
                    <i class="fas fa-clipboard-list"></i> My Bookings
                </a>
                <a href="payments.html" class="sidebar-item" data-page="payments">
                    <i class="fas fa-wallet"></i> My Payments
                </a>
                <a href="notifications.html" class="sidebar-item" data-page="notifications">
                    <i class="fas fa-bell"></i> Notifications
                </a>
                <a href="reviews.html" class="sidebar-item active" data-page="reviews">
                    <i class="fas fa-star"></i> Reviews
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="#" onclick="logout()" class="sidebar-item" style="color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <button id="menuBtn" class="btn btn-outline" style="padding: 0.5rem 0.8rem; display: none;">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="brand-font">Reviews</h2>
                <div class="user-profile" style="display: flex; align-items: center; gap: 1rem;">
                    <span id="userName" style="font-weight: 600;">Customer</span>
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;">
                        <span id="userInitial">C</span>
                    </div>
                </div>
            </header>

            <!-- Stats Grid -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem;">
                <div class="card stat-card">
                    <span class="stat-label">Total Reviews Given</span>
                    <span class="stat-value" id="reviewsCount">0</span>
                </div>
                <div class="card stat-card">
                    <span class="stat-label">Average Rating Given</span>
                    <span class="stat-value" id="avgRating">0.0</span>
                </div>
                <div class="card stat-card">
                    <span class="stat-label">Active Events</span>
                    <span class="stat-value" id="activeEventsCount">0</span>
                </div>
            </div>

            <!-- Header Action -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                    <h3 class="brand-font" style="font-size: 1.8rem; margin: 0;">Review History</h3>
                    <div style="display: flex; background: rgba(0,0,0,0.05); padding: 0.3rem; border-radius: 50px; border: 1px solid var(--border);">
                        <button onclick="setReviewFilter('all')" id="btnFilterAll" class="btn btn-primary" style="padding: 0.4rem 1.2rem; font-size: 0.85rem; border-radius: 50px; border: none; box-shadow: none;">All Reviews</button>
                        <button onclick="setReviewFilter('mine')" id="btnFilterMine" class="btn" style="padding: 0.4rem 1.2rem; font-size: 0.85rem; border-radius: 50px; border: none; background: transparent; color: var(--text); box-shadow: none;">My Reviews</button>
                    </div>
                </div>
                <button onclick="openReviewModal()" class="btn btn-primary">
                    <i class="fas fa-pencil-alt"></i> Write a Review
                </button>
            </div>

            <!-- Reviews Grid -->
            <div id="reviewsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;">
                <!-- Review cards will be injected dynamically -->
            </div>
        </main>
    </div>

    <!-- Write/Edit Review Modal -->
    <div class="modal-overlay" id="reviewModal">
        <div class="modal-card" style="max-width: 550px;">
            <h3 class="brand-font mb-2" id="modalTitle" style="font-size: 1.8rem; color: var(--secondary);">Write a Review</h3>
            <form id="reviewForm">
                <input type="hidden" id="reviewId" value="">
                
                <div class="form-group">
                    <label class="form-label">Associated Event</label>
                    <div class="select-wrapper">
                        <select id="eventSelect" class="form-control" style="appearance: none; -webkit-appearance: none;" required>
                            <option value="">-- Choose Event --</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Service Package</label>
                    <div class="select-wrapper">
                        <select id="packageSelect" class="form-control" style="appearance: none; -webkit-appearance: none;" required>
                            <option value="">-- Choose Package --</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Rating</label>
                    <div class="star-rating" id="modalStarRating" data-value="0" style="display: flex; margin-top: 0.2rem;">
                        <span class="star" data-val="1">★</span>
                        <span class="star" data-val="2">★</span>
                        <span class="star" data-val="3">★</span>
                        <span class="star" data-val="4">★</span>
                        <span class="star" data-val="5">★</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Comments</label>
                    <textarea id="packageComment" class="form-control" placeholder="Describe your experience with this service package..." rows="4" required></textarea>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeReviewModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveReviewBtn">Submit Review</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const user = requireAuth(['CUSTOMER']);
        let customerEvents = [];
        let allPackages = [];
        let allReviews = [];
        let customerReviews = [];
        let activeFilter = 'all'; // 'all' or 'mine'

        document.addEventListener('DOMContentLoaded', async () => {
            if (!user) return;

            // Set user profile details
            document.getElementById('userName').innerText = user.name;
            document.getElementById('userInitial').innerText = user.name.charAt(0);

            // Set up star rating logic in modal
            const stars = document.querySelectorAll('.star-rating .star');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const val = parseInt(this.dataset.val);
                    const container = this.parentElement;
                    container.dataset.value = val;
                    stars.forEach((s, idx) => {
                        s.classList.toggle('active', idx < val);
                    });
                });
            });

            await loadData();
        });

        async function loadData() {
            showLoader();
            try {
                // Fetch events, packages and reviews concurrently
                const [events, packages, reviews] = await Promise.all([
                    api.get(`/events/customer/${user.id}`),
                    api.get('/packages'),
                    api.get('/reviews')
                ]);

                customerEvents = events || [];
                allPackages = packages || [];
                allReviews = reviews || [];
                // Filter reviews that belong to this customer
                customerReviews = allReviews.filter(r => r.customerId === user.id);

                renderStats();
                populateDropdowns();
                renderReviews();
            } catch (error) {
                console.error("Failed to load reviews data:", error);
                showToast('Failed to load reviews data', 'error');
            } finally {
                hideLoader();
            }
        }

        function renderStats() {
            document.getElementById('reviewsCount').innerText = customerReviews.length;
            document.getElementById('activeEventsCount').innerText = customerEvents.length;

            if (customerReviews.length === 0) {
                document.getElementById('avgRating').innerText = '0.0';
                return;
            }

            const totalRating = customerReviews.reduce((sum, r) => sum + (r.packageRating || 0), 0);
            const avg = totalRating / customerReviews.length;
            document.getElementById('avgRating').innerText = avg.toFixed(1);
        }

        function populateDropdowns() {
            const eventSelect = document.getElementById('eventSelect');
            const packageSelect = document.getElementById('packageSelect');

            // Reset
            eventSelect.innerHTML = '<option value="">-- Choose Event --</option>';
            packageSelect.innerHTML = '<option value="">-- Choose Package --</option>';

            customerEvents.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e.eventId;
                opt.innerText = `${e.eventName} (${formatDate(e.eventDate)})`;
                eventSelect.appendChild(opt);
            });

            allPackages.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.packageId;
                opt.innerText = `${p.title} - ${p.vendorName || 'Vendor'}`;
                packageSelect.appendChild(opt);
            });
        }

        function setReviewFilter(filter) {
            activeFilter = filter;
            const btnAll = document.getElementById('btnFilterAll');
            const btnMine = document.getElementById('btnFilterMine');
            
            if (filter === 'all') {
                btnAll.className = 'btn btn-primary';
                btnAll.style.background = '';
                btnAll.style.color = '';
                
                btnMine.className = 'btn';
                btnMine.style.background = 'transparent';
                btnMine.style.color = 'var(--text)';
            } else {
                btnMine.className = 'btn btn-primary';
                btnMine.style.background = '';
                btnMine.style.color = '';
                
                btnAll.className = 'btn';
                btnAll.style.background = 'transparent';
                btnAll.style.color = 'var(--text)';
            }
            
            renderReviews();
        }

        function renderReviews() {
            const grid = document.getElementById('reviewsGrid');
            const reviewsToShow = activeFilter === 'mine' ? customerReviews : allReviews;
            
            if (reviewsToShow.length === 0) {
                grid.innerHTML = `
                    <div class="card text-center" style="grid-column: 1/-1; padding: 3rem;">
                        <i class="far fa-star" style="font-size: 3.5rem; color: var(--primary); opacity: 0.5; margin-bottom: 1.5rem;"></i>
                        <h4 class="brand-font mb-1" style="font-size: 1.5rem;">No Reviews Found</h4>
                        <p class="text-muted">${activeFilter === 'mine' ? 'You have not written any package reviews yet.' : 'No package reviews have been written yet.'}</p>
                        ${activeFilter === 'mine' ? '<button onclick="openReviewModal()" class="btn btn-primary mt-2">Write First Review</button>' : ''}
                    </div>
                `;
                return;
            }

            grid.innerHTML = [...reviewsToShow].reverse().map(r => {
                const event = customerEvents.find(e => e.eventId === r.eventId);
                const pkg = allPackages.find(p => p.packageId === r.packageId);

                const eventName = event ? event.eventName : null;
                const packageTitle = pkg ? pkg.title : `Package #${r.packageId}`;
                const vendorName = pkg ? (pkg.vendorName || 'Ethereal Partner') : 'Vendor';
                const isOwnReview = r.customerId === user.id;

                let starsHtml = '';
                for (let i = 1; i <= 5; i++) {
                    starsHtml += `<i class="${i <= r.packageRating ? 'fas' : 'far'} fa-star"></i>`;
                }

                // Metadata badge showing either My Review or Customer Name
                let metaHtml = '';
                if (isOwnReview) {
                    metaHtml = `<span><i class="far fa-calendar-alt"></i> ${eventName || 'My Wedding'}</span>
                                <span class="badge badge-confirmed" style="background: rgba(183, 110, 121, 0.15); color: var(--primary); font-size: 0.72rem; font-weight: 700; border: 1px solid rgba(183, 110, 121, 0.25);">My Review</span>`;
                } else {
                    metaHtml = `<span><i class="fas fa-user-circle"></i> Reviewed by <strong>${r.customerName || 'Verified Couple'}</strong></span>
                                <span class="badge badge-confirmed" style="background: rgba(76, 175, 80, 0.15); color: #4CAF50; font-size: 0.72rem; font-weight: 700; border: 1px solid rgba(76, 175, 80, 0.25);"><i class="fas fa-check-circle"></i> Verified</span>`;
                }

                // Action buttons only visible to owner
                let actionsHtml = '';
                if (isOwnReview) {
                    actionsHtml = `
                        <div class="review-actions">
                            <button onclick="editReview(${r.reviewId})" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.78rem; border-color: var(--primary); color: var(--primary);">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button onclick="deleteReview(${r.reviewId})" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.78rem; border-color: var(--danger); color: var(--danger);">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    `;
                }

                return `
                    <div class="review-card">
                        <div>
                            <div class="star-rating-static">
                                ${starsHtml}
                            </div>
                            <h4 class="brand-font" style="font-size: 1.3rem; color: var(--secondary); margin-bottom: 0.4rem; line-height: 1.2;">
                                ${packageTitle}
                            </h4>
                            <div style="font-size: 0.85rem; color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.8rem;">
                                by ${vendorName}
                            </div>
                            <p style="font-style: italic; color: var(--text-dark); line-height: 1.5; font-size: 0.95rem; margin-top: 0.5rem; word-break: break-word;">
                                "${r.packageComment}"
                            </p>
                        </div>
                        <div>
                            <div class="review-meta">
                                ${metaHtml}
                            </div>
                            ${actionsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openReviewModal() {
            document.getElementById('reviewForm').reset();
            document.getElementById('reviewId').value = '';
            document.getElementById('modalTitle').innerText = 'Write a Review';
            document.getElementById('saveReviewBtn').innerText = 'Submit Review';
            
            // Reset stars
            const container = document.getElementById('modalStarRating');
            container.dataset.value = "0";
            container.querySelectorAll('.star').forEach(s => s.classList.remove('active'));

            document.getElementById('reviewModal').style.display = 'flex';
        }

        function closeReviewModal() {
            document.getElementById('reviewModal').style.display = 'none';
        }

        async function editReview(id) {
            const review = customerReviews.find(r => r.reviewId === id);
            if (!review) return;

            document.getElementById('reviewId').value = review.reviewId;
            document.getElementById('eventSelect').value = review.eventId;
            document.getElementById('packageSelect').value = review.packageId;
            document.getElementById('packageComment').value = review.packageComment;

            // Stars
            const val = review.packageRating || 0;
            const container = document.getElementById('modalStarRating');
            container.dataset.value = val;
            container.querySelectorAll('.star').forEach((s, idx) => {
                s.classList.toggle('active', idx < val);
            });

            document.getElementById('modalTitle').innerText = 'Edit Review';
            document.getElementById('saveReviewBtn').innerText = 'Save Changes';
            document.getElementById('reviewModal').style.display = 'flex';
        }

        document.getElementById('reviewForm').onsubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('saveReviewBtn');
            const reviewId = document.getElementById('reviewId').value;
            const ratingValue = parseInt(document.getElementById('modalStarRating').dataset.value);

            if (ratingValue === 0) {
                showToast('Please select a star rating', 'warning');
                return;
            }

            utils.setLoading(btn, true, 'Saving...');

            const payload = {
                eventId: parseInt(document.getElementById('eventSelect').value),
                customerId: user.id,
                packageId: parseInt(document.getElementById('packageSelect').value),
                packageRating: ratingValue,
                packageComment: document.getElementById('packageComment').value
            };

            try {
                if (reviewId) {
                    // Update: Call native PUT endpoint
                    payload.reviewId = parseInt(reviewId);
                    await api.put(`/reviews/${reviewId}`, payload);
                    showToast('Review updated successfully!', 'success');
                } else {
                    // Create: Call native POST endpoint
                    await api.post('/reviews', payload);
                    showToast('Review submitted successfully!', 'success');
                }
                closeReviewModal();
                await loadData();
            } catch (error) {
                console.error("Failed to save review:", error);
                showToast(error.message || 'Failed to save review', 'error');
            } finally {
                utils.setLoading(btn, false, reviewId ? 'Save Changes' : 'Submit Review');
            }
        };

        async function deleteReview(id) {
            confirmModal('Are you sure you want to delete this review?', async () => {
                showLoader();
                try {
                    await api.delete(`/reviews/${id}`);
                    showToast('Review deleted successfully', 'success');
                    await loadData();
                } catch (error) {
                    console.error("Failed to delete review:", error);
                    showToast('Failed to delete review', 'error');
                } finally {
                    hideLoader();
                }
            });
        }
    </script>
</body>
</html>
