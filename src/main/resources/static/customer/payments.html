<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Payments | Ethereal Weddings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .payment-card {
            background: #fff;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            transition: transform 0.3s;
        }

        .payment-card:hover {
            transform: translateY(-5px);
        }

        .amount-display {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin: 1rem 0;
        }

        .payment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .empty-state {
            text-align: center;
            padding: 5rem;
            background: #fff;
            border-radius: 20px;
            border: 2px dashed var(--border);
        }
    </style>
</head>

<body>

    <div class="sidebar-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-font sidebar-logo">Ethereal</h1>
                <span style="font-size: 0.7rem; color: var(--primary); letter-spacing: 2px;">CUSTOMER PORTAL</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-item" data-page="dashboard">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="events.html" class="sidebar-item" data-page="events">
                    <i class="fas fa-calendar-alt"></i> My Events
                </a>
                <a href="packages.html" class="sidebar-item" data-page="packages">
                    <i class="fas fa-box-open"></i> Browse Packages
                </a>
                <a href="bookings.html" class="sidebar-item" data-page="bookings">
                    <i class="fas fa-clipboard-list"></i> My Bookings
                </a>
                <a href="payments.html" class="sidebar-item active" data-page="payments">
                    <i class="fas fa-wallet"></i> My Payments
                </a>
                <a href="notifications.html" class="sidebar-item" data-page="notifications">
                    <i class="fas fa-bell"></i> Notifications
                </a>
                <a href="reviews.html" class="sidebar-item" data-page="reviews">
                    <i class="fas fa-star"></i> My Reviews
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="#" onclick="logout()" class="sidebar-item" style="color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2 class="brand-font">My Payments</h2>
                <div class="user-profile" onclick="openProfileModal()" style="display: flex; align-items: center; gap: 1rem; cursor: pointer;">
                    <span id="userName" style="font-weight: 600;">Customer</span>
                    <div
                        style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;">
                        <span id="userInitial">C</span>
                    </div>
                </div>
            </header>

            <div class="section-header mt-2">
                <h3 class="brand-font">Pending Payments</h3>
                <p class="text-muted">Invoices ready for payment</p>
            </div>

            <div id="pendingPayments" class="payment-grid"></div>

            <div class="section-header mt-4">
                <h3 class="brand-font">Payment History</h3>
                <p class="text-muted">Your past transactions</p>
            </div>

            <div id="paymentHistory">
                <div class="card p-0" style="overflow: hidden;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Event</th>
                                <th>Type</th>
                                <th>Paid Date</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js?v=2"></script>
    <script>
        const user = requireAuth(['CUSTOMER']);

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            document.getElementById('userName').innerText = user.name || 'Customer';
            document.getElementById('userInitial').innerText = (user.name || 'C').charAt(0);
            showLoader();
            try {
                const payments = await api.get(`/payments/customer/${user.id}`);
                renderPayments(payments);
            } catch (error) {
                console.error(error);
                showToast('Failed to load payments', 'error');
            } finally {
                hideLoader();
            }
        }

        function renderPayments(payments) {
            const pendingContainer = document.getElementById('pendingPayments');
            const historyTable = document.getElementById('historyTableBody');

            const pending = payments.filter(p => p.status === 'PENDING');
            const history = payments.filter(p => p.status !== 'PENDING' && p.status !== 'PROCESSING');

            if (pending.length === 0) {
                pendingContainer.innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1; padding: 3rem;">
                    <i class="fas fa-check-circle" style="font-size: 2.5rem; color: var(--success); margin-bottom: 1rem;"></i>
                    <h4 class="brand-font">No pending payments</h4>
                    <p class="text-muted">All your invoices are up to date.</p>
                </div>
            `;
            } else {
                pendingContainer.innerHTML = pending.map(p => {
                    const isPartial = p.status === 'PENDING' && p.amount > 0;
                    return `
                <div class="payment-card">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <span class="badge ${isPartial ? 'badge-warning' : 'badge-pending'}" style="margin-bottom: 0.5rem;">
                                ${isPartial ? '50% REMAINING' : p.paymentType + ' PLAN'}
                            </span>
                            <h4 class="brand-font" style="font-size: 1.4rem;">${p.eventName || 'Wedding Booking'}</h4>
                            <p class="text-muted" style="font-size: 0.9rem;">Booking ID: #${p.bookingId}</p>
                        </div>
                        <i class="fas fa-file-invoice-dollar" style="font-size: 1.5rem; color: var(--primary); opacity: 0.5;"></i>
                    </div>
                    <div class="amount-display">${formatLKR(p.dueAmount)}</div>
                    <div style="background: var(--bg-light); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.5rem;">
                            <span class="text-muted">Total Amount:</span>
                            <span style="font-weight: 600;">${formatLKR(p.totalAmount)}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                            <span class="text-muted">Paid So Far:</span>
                            <span style="font-weight: 600; color: var(--success);">${formatLKR(p.amount)}</span>
                        </div>
                        ${isPartial ? `
                        <div style="margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid #eee;">
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                                <span style="color: #e67e22; font-weight: 600;">⚠ 2nd Milestone Due</span>
                                <span style="font-weight: 700; color: #e67e22;">${formatLKR(p.dueAmount)}</span>
                            </div>
                        </div>` : ''}
                    </div>
                    <button onclick="processPayment(${p.paymentId}, ${p.dueAmount}, ${p.totalAmount}, '${p.eventName || 'Wedding Booking'}', ${p.bookingId}, '${p.status}', ${p.amount})"
                            class="btn btn-primary w-100" style="padding: 1rem; border-radius: 12px; font-weight: 700;">
                        <i class="fas fa-credit-card"></i> ${isPartial ? 'PAY REMAINING 50%' : 'PAY NOW'}
                    </button>
                </div>
            `}).join('');
            }

            if (history.length === 0) {
                historyTable.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem;">No payment history found.</td></tr>';
            } else {
                historyTable.innerHTML = history.map(p => `
                <tr>
                    <td style="font-weight: 600;">${p.eventName || 'Wedding Booking'}</td>
                    <td><span class="badge" style="background: #f0f0f0; color: #666;">${p.paymentType}</span></td>
                    <td>${formatDate(p.paymentDate)}</td>
                    <td style="font-weight: 700; color: var(--primary);">${formatLKR(p.totalAmount)}</td>
                    <td>${statusBadge(p.status)}</td>
                </tr>
            `).join('');
            }
        }

        async function processPayment(paymentId, amount, totalAmount, eventName, bookingId, currentStatus, alreadyPaid) {

            const isSecondMilestone = currentStatus === 'PARTIALLY_PAID' || (currentStatus === 'PENDING' && alreadyPaid > 0);

            // STEP 1 — Choose Payment Plan (skip if second milestone)
            let plan = 'MILESTONE';
            if (!isSecondMilestone) {
                const { value: selectedPlan } = await Swal.fire({
                    title: 'Choose Payment Plan',
                    html: `
                    <div style="text-align: left; padding: 0 1rem;">
                        <p style="color: #888; margin-bottom: 1rem;">How would you like to pay?</p>
                        <div style="display: flex; flex-direction: column; gap: 1rem;">
                            <label style="display: flex; align-items: flex-start; gap: 1rem; padding: 1rem; border: 1px solid #ddd; border-radius: 12px; cursor: pointer;">
                                <input type="radio" name="swalPlan" value="FULL" checked style="margin-top: 0.3rem;">
                                <div>
                                    <div style="font-weight: 700;">Full Payment</div>
                                    <div style="font-size: 0.8rem; color: #888;">Pay ${formatLKR(amount)} now to secure everything.</div>
                                </div>
                            </label>
                            <label style="display: flex; align-items: flex-start; gap: 1rem; padding: 1rem; border: 1px solid #ddd; border-radius: 12px; cursor: pointer;">
                                <input type="radio" name="swalPlan" value="MILESTONE" style="margin-top: 0.3rem;">
                                <div>
                                    <div style="font-weight: 700;">Milestone Plan</div>
                                    <div style="font-size: 0.8rem; color: #888;">Pay 50% now (${formatLKR(amount / 2)}) and 50% before the event.</div>
                                </div>
                            </label>
                        </div>
                    </div>
                `,
                    showCancelButton: true,
                    confirmButtonText: 'NEXT',
                    confirmButtonColor: '#b7935e',
                    preConfirm: () => document.querySelector('input[name="swalPlan"]:checked').value
                });
                if (!selectedPlan) return;
                plan = selectedPlan;
            }

            // Calculate actual amount to pay
            const amountToPay = (plan === 'MILESTONE' && !isSecondMilestone) ? amount / 2 : amount;

            // STEP 2 — Choose Payment Method
            const { value: method } = await Swal.fire({
                title: 'Select Payment Method',
                html: `
                <div style="text-align: left; padding: 0 1rem;">
                    <p style="color: #888; margin-bottom: 1rem;">
                        ${isSecondMilestone ? 'Paying final milestone: ' : plan === 'MILESTONE' ? 'Paying 1st milestone: ' : 'Paying full amount: '}
                        <strong>${formatLKR(amountToPay)}</strong>
                    </p>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <label style="display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 2px solid #eee; border-radius: 12px; cursor: pointer;">
                            <input type="radio" name="payMethod" value="CARD" checked>
                            <div style="display: flex; align-items: center; gap: 0.8rem;">
                                <i class="fas fa-credit-card" style="font-size: 1.5rem; color: #b7935e;"></i>
                                <span style="font-weight: 600;">Credit / Debit Card</span>
                            </div>
                        </label>
                        <label style="display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 2px solid #eee; border-radius: 12px; cursor: pointer;">
                            <input type="radio" name="payMethod" value="BANK">
                            <div style="display: flex; align-items: center; gap: 0.8rem;">
                                <i class="fas fa-university" style="font-size: 1.5rem; color: #b7935e;"></i>
                                <span style="font-weight: 600;">Bank Transfer</span>
                            </div>
                        </label>
                    </div>
                </div>
            `,
                showCancelButton: true,
                confirmButtonText: 'NEXT',
                confirmButtonColor: '#b7935e',
                preConfirm: () => document.querySelector('input[name="payMethod"]:checked').value
            });

            if (!method) return;

            // STEP 3 — Card Payment Flow
            if (method === 'CARD') {

                // Choose Visa or Mastercard
                const { value: cardType } = await Swal.fire({
                    title: 'Select Card Type',
                    html: `
                    <div style="text-align: left; padding: 0 1rem;">
                        <p style="color: #888; margin-bottom: 1rem;">Please select your card network</p>
                        <div style="display: flex; flex-direction: column; gap: 1rem;">
                            <label style="display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 2px solid #eee; border-radius: 12px; cursor: pointer;">
                                <input type="radio" name="cardType" value="VISA" checked>
                                <div style="display: flex; align-items: center; gap: 0.8rem;">
                                    <div style="background: #1a1f71; color: white; padding: 0.3rem 0.8rem; border-radius: 6px; font-weight: 900; font-size: 1rem; letter-spacing: 1px;">VISA</div>
                                    <span style="font-weight: 600;">Visa Card</span>
                                </div>
                            </label>
                            <label style="display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 2px solid #eee; border-radius: 12px; cursor: pointer;">
                                <input type="radio" name="cardType" value="MASTERCARD">
                                <div style="display: flex; align-items: center; gap: 0.8rem;">
                                    <div style="display: flex;">
                                        <div style="width: 28px; height: 28px; background: #eb001b; border-radius: 50%;"></div>
                                        <div style="width: 28px; height: 28px; background: #f79e1b; border-radius: 50%; margin-left: -12px;"></div>
                                    </div>
                                    <span style="font-weight: 600;">Mastercard</span>
                                </div>
                            </label>
                        </div>
                    </div>
                `,
                    showCancelButton: true,
                    confirmButtonText: 'NEXT',
                    confirmButtonColor: '#b7935e',
                    preConfirm: () => document.querySelector('input[name="cardType"]:checked').value
                });

                if (!cardType) return;

                // Enter 16 digit card number
                const { value: cardNumber } = await Swal.fire({
                    title: `Enter ${cardType} Card Number`,
                    html: `
                    <div style="text-align: left; padding: 0 1rem;">
                        <p style="color: #888; margin-bottom: 1.5rem;">Enter your 16-digit card number</p>
                        <label style="font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.5rem;">Card Number</label>
                        <input type="text" id="cardNumberInput" placeholder="0000 0000 0000 0000"
                            maxlength="19"
                            style="width: 100%; padding: 0.9rem 1rem; border: 2px solid #ddd; border-radius: 10px; font-size: 1.1rem; letter-spacing: 2px; box-sizing: border-box;"
                            oninput="formatCardNumber(this)">
                        <p id="cardError" style="color: red; font-size: 0.85rem; margin-top: 0.5rem; display: none;">
                            ⚠ Please enter a valid 16-digit card number
                        </p>
                    </div>
                `,
                    showCancelButton: true,
                    confirmButtonText: 'PAY NOW',
                    confirmButtonColor: '#b7935e',
                    preConfirm: () => {
                        const cardNum = document.getElementById('cardNumberInput').value.replace(/\s/g, '');
                        if (cardNum.length !== 16 || !/^\d{16}$/.test(cardNum)) {
                            document.getElementById('cardError').style.display = 'block';
                            document.getElementById('cardNumberInput').style.border = '2px solid red';
                            return false;
                        }
                        document.getElementById('cardError').style.display = 'none';
                        document.getElementById('cardNumberInput').style.border = '2px solid green';
                        return cardNum;
                    }
                });

                if (!cardNumber) return;

                // Process card payment and download slip
                const success = await submitPayment(paymentId, plan, amountToPay, totalAmount, isSecondMilestone);
                if (success) {
                    let bookedPackages = [];
                    let bookingDetails = {};
                    try {
                        const [pkgs, bData] = await Promise.all([
                            api.get(`/bookings/${bookingId}/packages`),
                            api.get(`/bookings/${bookingId}`)
                        ]);
                        bookedPackages = pkgs;
                        bookingDetails = bData;
                    } catch (err) {
                        console.error("Failed to load booked packages/details for slip", err);
                    }
                    downloadPaymentSlip({
                        paymentId,
                        bookingId,
                        eventName,
                        amountToPay,
                        totalAmount,
                        plan,
                        isSecondMilestone,
                        method: 'CARD',
                        cardType,
                        cardNumber: '**** **** **** ' + cardNumber.substring(12),
                        date: new Date().toLocaleDateString('en-LK'),
                        packages: bookedPackages,
                        customerName: user.name || 'Customer',
                        customerId: user.id || 17,
                        eventDate: bookingDetails.bookingDate,
                        location: bookingDetails.location
                    });

                    // Redirect to notifications page after giving download stream enough time to start
                    setTimeout(() => {
                        window.location.href = 'notifications.html';
                    }, 1500);
                }

            } else {
                // STEP 3 — Bank Transfer Flow

                // Select bank
                const { value: selectedBank } = await Swal.fire({
                    title: 'Select Your Bank',
                    html: `
                    <div style="text-align: left; padding: 0 1rem;">
                        <p style="color: #888; margin-bottom: 1rem;">Choose the bank you will transfer from</p>
                        <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                            ${[
                            { value: 'COMMERCIAL', label: 'Commercial Bank', color: '#cc0000' },
                            { value: 'BOC', label: 'Bank of Ceylon', color: '#003087' },
                            { value: 'SAMPATH', label: 'Sampath Bank', color: '#e31837' },
                            { value: 'PEOPLES', label: "People's Bank", color: '#ff6600' },
                            { value: 'HNB', label: 'HNB', color: '#009900' }
                        ].map((b, i) => `
                                <label style="display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1rem; border: 2px solid #eee; border-radius: 10px; cursor: pointer;">
                                    <input type="radio" name="bankSelect" value="${b.value}" ${i === 0 ? 'checked' : ''}>
                                    <div style="width: 10px; height: 10px; background: ${b.color}; border-radius: 50%;"></div>
                                    <span style="font-weight: 600;">${b.label}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `,
                    showCancelButton: true,
                    confirmButtonText: 'NEXT',
                    confirmButtonColor: '#b7935e',
                    preConfirm: () => document.querySelector('input[name="bankSelect"]:checked').value
                });

                if (!selectedBank) return;

                const bankConfigs = {
                    'COMMERCIAL': { name: 'Commercial Bank', digits: 10 },
                    'BOC': { name: 'Bank of Ceylon (BOC)', digits: 10 },
                    'SAMPATH': { name: 'Sampath Bank', digits: 12 },
                    'PEOPLES': { name: "People's Bank", digits: 15 },
                    'HNB': { name: 'HNB (Hatton National Bank)', digits: 12 }
                };

                const config = bankConfigs[selectedBank];

                // Enter bank-specific account number
                const { value: accountNumber } = await Swal.fire({
                    title: 'Enter Account Number',
                    html: `
                    <div style="text-align: left; padding: 0 1rem;">
                        <p style="color: #888; margin-bottom: 1.5rem;">Enter the ${config.digits}-digit account number you transferred from (${config.name})</p>
                        <label style="font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.5rem;">Account Number</label>
                        <input type="text" id="accountInput" placeholder="${'0'.repeat(config.digits)}"
                            maxlength="${config.digits}"
                            style="width: 100%; padding: 0.9rem 1rem; border: 2px solid #ddd; border-radius: 10px; font-size: 1.1rem; letter-spacing: 2px; box-sizing: border-box;"
                            oninput="this.value = this.value.replace(/\\D/g, '')">
                        <p id="accountError" style="color: red; font-size: 0.85rem; margin-top: 0.5rem; display: none;">
                            ⚠ Please enter a valid ${config.digits}-digit account number for ${config.name}
                        </p>
                    </div>
                `,
                    showCancelButton: true,
                    confirmButtonText: 'PAY NOW',
                    confirmButtonColor: '#b7935e',
                    preConfirm: () => {
                        const accNum = document.getElementById('accountInput').value;
                        const reqLength = config.digits;
                        if (accNum.length !== reqLength || !new RegExp(`^\\d{${reqLength}}$`).test(accNum)) {
                            document.getElementById('accountError').style.display = 'block';
                            document.getElementById('accountInput').style.border = '2px solid red';
                            return false;
                        }
                        document.getElementById('accountError').style.display = 'none';
                        document.getElementById('accountInput').style.border = '2px solid green';
                        return accNum;
                    }
                });

                if (!accountNumber) return;

                // Process bank payment then download slip
                const success = await submitPayment(paymentId, plan, amountToPay, totalAmount, isSecondMilestone);
                if (success) {
                    let bookedPackages = [];
                    let bookingDetails = {};
                    try {
                        const [pkgs, bData] = await Promise.all([
                            api.get(`/bookings/${bookingId}/packages`),
                            api.get(`/bookings/${bookingId}`)
                        ]);
                        bookedPackages = pkgs;
                        bookingDetails = bData;
                    } catch (err) {
                        console.error("Failed to load booked packages/details for slip", err);
                    }
                    downloadPaymentSlip({
                        paymentId,
                        bookingId,
                        eventName,
                        amountToPay,
                        totalAmount,
                        plan,
                        isSecondMilestone,
                        method: 'BANK',
                        bank: selectedBank,
                        accountNumber,
                        date: new Date().toLocaleDateString('en-LK'),
                        packages: bookedPackages,
                        customerName: user.name || 'Customer',
                        customerId: user.id || 17,
                        eventDate: bookingDetails.bookingDate,
                        location: bookingDetails.location
                    });

                    // Redirect to notifications page after giving download stream enough time to start
                    setTimeout(() => {
                        window.location.href = 'notifications.html';
                    }, 1500);
                }
                return;
            }
        }

        async function submitPayment(paymentId, plan, amountToPay, totalAmount, isSecondMilestone) {
            showLoader();
            try {
                let newStatus;
                if (plan === 'FULL') {
                    newStatus = 'PAID';
                } else if (isSecondMilestone) {
                    newStatus = 'PAID';
                } else {
                    newStatus = 'PENDING';
                }

                await api.put(`/payments/${paymentId}/status?status=${newStatus}&paymentType=${plan}`);
                hideLoader();

                await Swal.fire({
                    title: 'Payment Successful!',
                    text: isSecondMilestone
                        ? 'Final milestone paid! Your booking is fully secured.'
                        : plan === 'MILESTONE'
                            ? 'First milestone paid! Remember to pay the remaining 50% before the event.'
                            : 'Full payment received! Your booking is now secured.',
                    icon: 'success',
                    confirmButtonColor: '#b7935e'
                });

                return true;
            } catch (error) {
                hideLoader();
                showToast('Payment processing failed', 'error');
                return false;
            }
        }

        function downloadPaymentSlip(data) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // 1. Draw an elegant dark-gold accent line at the very top
            doc.setFillColor(183, 147, 94);
            doc.rect(0, 0, 210, 4, 'F');

            let y = 18;

            // 2. Company branding
            doc.setTextColor(183, 147, 94);
            doc.setFontSize(22);
            doc.setFont('helvetica', 'bold');
            doc.text('ETHEREAL WEDDINGS', 14, y);

            doc.setTextColor(100, 100, 100);
            doc.setFontSize(8);
            doc.setFont('helvetica', 'normal');
            doc.text('Ethereal Weddings (Pvt) Ltd | No. 24, Flower Road, Colombo 07, Sri Lanka', 14, y + 5);
            doc.text('Email: billing@etherealweddings.com | Web: www.etherealweddings.com | Tel: +94 11 234 5678', 14, y + 9);

            // 3. Receipt / Invoice details on the top right
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text('PAYMENT RECEIPT', 200 - 6, y, { align: 'right' });

            doc.setTextColor(120, 120, 120);
            doc.setFontSize(9);
            doc.setFont('helvetica', 'normal');
            doc.text(`Receipt No: ETH-REC-${20000 + data.paymentId}`, 200 - 6, y + 5, { align: 'right' });
            doc.text(`Date: ${data.date}`, 200 - 6, y + 9, { align: 'right' });

            y += 20;

            // Divider Line
            doc.setDrawColor(220, 220, 220);
            doc.line(14, y, 196, y);
            y += 8;

            // 4. Customer Details (Bill To) & Invoice Metadata (Side-by-Side layout)
            // Left Side: Bill To
            doc.setTextColor(183, 147, 94);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'bold');
            doc.text('CUSTOMER DETAILS', 14, y);

            doc.setTextColor(0, 0, 0);
            doc.setFontSize(9);
            doc.setFont('helvetica', 'normal');
            doc.text(`Name         : ${data.customerName}`, 14, y + 6);
            doc.text(`ID           : CUST-00${data.customerId || 17}`, 14, y + 11);
            doc.text(`Event        : ${data.eventName}`, 14, y + 16);
            
            const formattedEventDate = data.eventDate ? new Date(data.eventDate).toLocaleDateString('en-LK', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }) : 'N/A';
            doc.text(`Event Date   : ${formattedEventDate}`, 14, y + 21);
            
            const locText = data.location || 'Not Set';
            doc.text(`Location     : ${locText}`, 14, y + 26);

            // Right Side: Booking Info & Status Badge
            doc.setTextColor(183, 147, 94);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'bold');
            doc.text('BOOKING & STATUS', 110, y);

            doc.setTextColor(0, 0, 0);
            doc.setFontSize(9);
            doc.setFont('helvetica', 'normal');
            doc.text(`Booking ID   : #${data.bookingId}`, 110, y + 6);
            doc.text(`Payment Plan : ${data.plan === 'MILESTONE' ? 'Milestone 2-Parts' : 'Full Payment'}`, 110, y + 11);

            const isPaid = data.isSecondMilestone || data.plan === 'FULL';
            const statusText = isPaid ? 'FULLY PAID' : 'PARTIALLY PAID';

            // Draw Status Badge Box
            doc.setFillColor(isPaid ? 230 : 255, isPaid ? 244 : 243, isPaid ? 234 : 230); // light green or orange
            doc.rect(110, y + 14, 50, 6, 'F');
            doc.setTextColor(isPaid ? 19 : 230, isPaid ? 115 : 126, isPaid ? 51 : 34); // deep green or orange text
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8);
            doc.text(statusText, 135, y + 18, { align: 'center' });

            y += 36;

            // 5. Booked Packages Details (Beautiful Modern Table)
            doc.setTextColor(183, 147, 94);
            doc.setFontSize(11);
            doc.setFont('helvetica', 'bold');
            doc.text('ORDER SUMMARY', 14, y);
            y += 4;

            // Draw Table Header Bar
            doc.setFillColor(248, 246, 242);
            doc.rect(14, y, 182, 8, 'F');

            doc.setTextColor(100, 100, 100);
            doc.setFontSize(9);
            doc.setFont('helvetica', 'bold');
            doc.text('Package Title / Description', 18, y + 5.5);
            doc.text('Qty', 130, y + 5.5, { align: 'center' });
            doc.text('Unit Price (LKR)', 160, y + 5.5, { align: 'right' });
            doc.text('Total (LKR)', 192, y + 5.5, { align: 'right' });

            y += 8;

            // Draw Table Rows
            doc.setTextColor(0, 0, 0);
            doc.setFont('helvetica', 'normal');

            const activePackages = (data.packages || []).filter(pkg => pkg.vendorStatus !== 'REJECTED' && pkg.vendorStatus !== 'CANCELLED');
            if (activePackages.length > 0) {
                activePackages.forEach((pkg, index) => {
                    // Alternating row background
                    if (index % 2 === 1) {
                        doc.setFillColor(252, 252, 252);
                        doc.rect(14, y, 182, 8, 'F');
                    }

                    const splitTitle = doc.splitTextToSize(pkg.packageTitle || 'N/A', 105);
                    const titleHeight = splitTitle.length * 5;
                    const rowHeight = Math.max(8, titleHeight + 2);

                    doc.text(splitTitle, 18, y + 5);
                    doc.text(String(pkg.quantity || 1), 130, y + 5, { align: 'center' });

                    const uPrice = Number(pkg.priceAtBooking);
                    const tPrice = uPrice * (pkg.quantity || 1);

                    doc.text(uPrice.toLocaleString('en-LK', { minimumFractionDigits: 2 }), 160, y + 5, { align: 'right' });
                    doc.text(tPrice.toLocaleString('en-LK', { minimumFractionDigits: 2 }), 192, y + 5, { align: 'right' });

                    // Bottom border for each row
                    doc.setDrawColor(240, 240, 240);
                    doc.line(14, y + rowHeight, 196, y + rowHeight);

                    y += rowHeight;
                });
            } else {
                // Default row if no packages fetched
                doc.text(data.eventName || 'Wedding Packages Selection', 18, y + 5);
                doc.text('1', 130, y + 5, { align: 'center' });
                doc.text(Number(data.totalAmount).toLocaleString('en-LK', { minimumFractionDigits: 2 }), 160, y + 5, { align: 'right' });
                doc.text(Number(data.totalAmount).toLocaleString('en-LK', { minimumFractionDigits: 2 }), 192, y + 5, { align: 'right' });

                doc.setDrawColor(240, 240, 240);
                doc.line(14, y + 8, 196, y + 8);
                y += 8;
            }

            y += 6;

            // 6. Financial Breakdown (Right-aligned layout)
            doc.setFontSize(9);

            // Total Amount Row
            doc.setFont('helvetica', 'normal');
            doc.text('Total Order Value :', 140, y, { align: 'right' });
            doc.setFont('helvetica', 'bold');
            doc.text(`LKR ${Number(data.totalAmount).toLocaleString('en-LK', { minimumFractionDigits: 2 })}`, 192, y, { align: 'right' });
            y += 6;

            // Paid So Far Row
            doc.setFont('helvetica', 'normal');
            doc.text('Amount Paid Today :', 140, y, { align: 'right' });
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(19, 115, 51); // success green color
            doc.text(`LKR ${Number(data.amountToPay).toLocaleString('en-LK', { minimumFractionDigits: 2 })}`, 192, y, { align: 'right' });
            y += 6;

            // Remaining Due Row
            doc.setTextColor(0, 0, 0);
            const remaining = data.isSecondMilestone || data.plan === 'FULL' ? 0 : data.totalAmount - data.amountToPay;
            doc.setFont('helvetica', 'normal');
            doc.text('Remaining Balance :', 140, y, { align: 'right' });
            doc.setFont('helvetica', 'bold');
            if (remaining > 0) {
                doc.setTextColor(230, 126, 34); // warning orange
            }
            doc.text(`LKR ${Number(remaining).toLocaleString('en-LK', { minimumFractionDigits: 2 })}`, 192, y, { align: 'right' });
            doc.setTextColor(0, 0, 0);
            y += 12;

            // 7. Payment Method Verification Badge
            doc.setFillColor(250, 250, 250);
            doc.setDrawColor(230, 230, 230);
            doc.rect(14, y, 182, 18, 'FD');

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9);
            doc.text('PAYMENT VERIFICATION METHOD', 20, y + 6);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.5);
            if (data.method === 'CARD') {
                doc.text(`Paid via Credit/Debit Card (${data.cardType}) - Transaction Account Number: ${data.cardNumber}`, 20, y + 12);
            } else {
                doc.text(`Paid via Bank Transfer from ${data.bank} - Account Reference Number: ${data.accountNumber}`, 20, y + 12);
            }

            y += 28;

            // 8. Footer component (Seal & Thank you message)
            doc.setFontSize(8.5);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(183, 147, 94);
            doc.text('ETHEREAL WEDDINGS (PVT) LTD - DIGITAL BILLING SYSTEM', 105, y, { align: 'center' });

            doc.setFontSize(8);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(150, 150, 150);
            doc.text('Thank you for letting us make your dream wedding a reality.', 105, y + 4.5, { align: 'center' });
            doc.text('This is a legally valid digitally generated receipt. No physical signature is required.', 105, y + 8.5, { align: 'center' });

            doc.save(`receipt-invoice-${data.paymentId}.pdf`);
        }

        function formatCardNumber(input) {
            let value = input.value.replace(/\D/g, '');
            value = value.substring(0, 16);
            input.value = value.match(/.{1,4}/g)?.join(' ') || value;
        }

    </script>
</body>

</html>
