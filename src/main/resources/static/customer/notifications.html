<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Ethereal Weddings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="sidebar-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-font sidebar-logo">Ethereal</h1>
                <span style="font-size: 0.7rem; color: var(--primary); letter-spacing: 2px;">CUSTOMER PORTAL</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-item" data-page="dashboard">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="events.html" class="sidebar-item" data-page="events">
                    <i class="fas fa-calendar-alt"></i> My Events
                </a>
                <a href="packages.html" class="sidebar-item" data-page="packages">
                    <i class="fas fa-box-open"></i> Browse Packages
                </a>
                <a href="bookings.html" class="sidebar-item" data-page="bookings">
                    <i class="fas fa-clipboard-list"></i> My Bookings
                </a>
                <a href="payments.html" class="sidebar-item" data-page="payments">
                    <i class="fas fa-wallet"></i> My Payments
                </a>
                <a href="notifications.html" class="sidebar-item active" data-page="notifications">
                    <i class="fas fa-bell"></i> Notifications
                </a>
                <a href="reviews.html" class="sidebar-item" data-page="reviews">
                    <i class="fas fa-star"></i> Reviews
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="#" onclick="logout()" class="sidebar-item" style="color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2 class="brand-font">My Notifications</h2>
            </header>

            <div class="card" style="padding: 2rem;">
                <div id="notificationsList" style="display: flex; flex-direction: column; gap: 1rem;">
                    <div class="text-center py-2">
                        <i class="fas fa-circle-notch fa-spin text-primary"></i> Loading notifications...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const user = requireAuth(['CUSTOMER']);

        document.addEventListener('DOMContentLoaded', loadNotifications);

        async function loadNotifications() {
            try {
                const [bookings, payments] = await Promise.all([
                    api.get(`/bookings/customer/${user.id}`),
                    api.get(`/payments/customer/${user.id}`)
                ]);
                let allNotifications = [];

                // 1. Add Booking Notifications
                bookings.forEach(b => {
                    if (b.status === 'CANCELLED') {
                        allNotifications.push({
                            type: 'CANCELLED',
                            title: 'Booking Cancelled',
                            message: `Your booking for <strong>${b.eventName || 'Wedding Event'}</strong> has been cancelled, and all booked packages have been released.`,
                            date: b.updatedAt || b.createdAt,
                            eventId: b.eventId,
                            eventName: b.eventName || 'Event'
                        });
                    } else {
                        allNotifications.push({
                            type: 'CONFIRMED',
                            title: 'Booking Placed',
                            message: `You have successfully confirmed and placed the booking for <strong>${b.eventName || 'Wedding Event'}</strong>.`,
                            date: b.createdAt,
                            eventId: b.eventId,
                            eventName: b.eventName || 'Event'
                        });
                    }
                });

                // 2. Add Package Vendor-Response Notifications
                for (const b of bookings) {
                    try {
                        const pkgs = await api.get(`/bookings/${b.bookingId}/packages`);
                        pkgs.forEach(p => {
                            if (p.vendorStatus === 'APPROVED' || p.vendorStatus === 'CONFIRMED') {
                                allNotifications.push({
                                    type: 'APPROVED',
                                    title: 'Package Approved',
                                    message: `Your request for <strong>${p.packageTitle}</strong> has been approved by the vendor.`,
                                    date: p.vendorRespondedAt || p.createdAt || b.createdAt,
                                    eventId: b.eventId,
                                    eventName: b.eventName || 'Event'
                                });
                            } else if (p.vendorStatus === 'REJECTED') {
                                allNotifications.push({
                                    type: 'REJECTED',
                                    title: 'Package Rejected',
                                    message: `Your request for <strong>${p.packageTitle}</strong> was rejected by the vendor. Reason: <em>${p.rejectionReason || 'No reason provided'}</em>. Please select another package.`,
                                    date: p.vendorRespondedAt || p.createdAt || b.createdAt,
                                    eventId: b.eventId,
                                    eventName: b.eventName || 'Event'
                                });
                            }
                        });
                    } catch (e) {
                        console.error('Failed to load packages for booking', b.bookingId);
                    }
                }

                // 3. Add Payment & Refund Notifications
                payments.forEach(p => {
                    const formattedPaid = new Intl.NumberFormat('en-LK', {
                        style: 'currency',
                        currency: 'LKR',
                        minimumFractionDigits: 2
                    }).format(p.amount || 0).replace('LKR', 'LKR\u00A0');

                    const formattedTotal = new Intl.NumberFormat('en-LK', {
                        style: 'currency',
                        currency: 'LKR',
                        minimumFractionDigits: 2
                    }).format(p.totalAmount || 0).replace('LKR', 'LKR\u00A0');

                    const relatedBooking = bookings.find(b => b.bookingId === p.bookingId);
                    const eventId = p.eventId || (relatedBooking ? relatedBooking.eventId : null);

                    if (p.status === 'PAID') {
                        if (p.paymentType === 'FULL') {
                            allNotifications.push({
                                type: 'PAYMENT',
                                title: 'Full Payment Received',
                                message: `We have received your full payment of <strong>${formattedTotal}</strong> for <strong>${p.eventName || 'Wedding Booking'}</strong>. Your wedding booking is now fully secured!`,
                                date: p.paymentDate || p.createdAt,
                                eventId: eventId,
                                eventName: p.eventName || 'Event'
                            });
                        } else {
                            allNotifications.push({
                                type: 'PAYMENT',
                                title: 'Final Milestone Paid',
                                message: `We have received your final milestone payment of <strong>${formattedPaid}</strong> for <strong>${p.eventName || 'Wedding Booking'}</strong>. Your wedding booking is now fully secured!`,
                                date: p.paymentDate || p.createdAt,
                                eventId: eventId,
                                eventName: p.eventName || 'Event'
                            });
                        }
                    } else if (p.status === 'PARTIALLY_PAID') {
                        allNotifications.push({
                            type: 'PAYMENT',
                            title: 'First Milestone Paid (50%)',
                            message: `We have received your first milestone payment of <strong>${formattedPaid}</strong> for <strong>${p.eventName || 'Wedding Booking'}</strong>. The remaining balance is due before the event.`,
                            date: p.paymentDate || p.createdAt,
                            eventId: eventId,
                            eventName: p.eventName || 'Event'
                        });
                    } else if (p.status === 'CANCELLED' && p.amount > 0) {
                        allNotifications.push({
                            type: 'REFUND',
                            title: 'Payment Refunded',
                            message: `Your paid amount of <strong>${formattedPaid}</strong> for <strong>${p.eventName || 'Wedding Booking'}</strong> has been refunded due to booking cancellation.`,
                            date: p.paymentDate || p.createdAt,
                            eventId: eventId,
                            eventName: p.eventName || 'Event'
                        });
                    }
                });

                renderNotifications(allNotifications);
            } catch (error) {
                console.error(error);
                document.getElementById('notificationsList').innerHTML = '<div class="text-danger">Failed to load notifications.</div>';
            }
        }

        function renderNotifications(notifications) {
            const list = document.getElementById('notificationsList');
            
            if (notifications.length === 0) {
                list.innerHTML = `
                    <div class="empty-state text-center" style="padding: 3rem;">
                        <i class="fas fa-bell-slash text-muted" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <h4 class="brand-font">No Notifications</h4>
                        <p class="text-muted">You have no new notifications at this time.</p>
                    </div>
                `;
                return;
            }

            // Sort by date descending
            notifications.sort((a, b) => new Date(b.date) - new Date(a.date));

            list.innerHTML = notifications.map(n => {
                let icon = 'fa-bell';
                let iconColor = 'var(--primary)';
                
                if (n.type === 'REJECTED') {
                    icon = 'fa-times-circle';
                    iconColor = 'var(--danger)';
                } else if (n.type === 'APPROVED') {
                    icon = 'fa-check-circle';
                    iconColor = '#4CAF50';
                } else if (n.type === 'CONFIRMED') {
                    icon = 'fa-heart';
                    iconColor = 'var(--primary)';
                } else if (n.type === 'CANCELLED') {
                    icon = 'fa-ban';
                    iconColor = '#95a5a6';
                } else if (n.type === 'PAYMENT') {
                    icon = 'fa-credit-card';
                    iconColor = '#2ecc71';
                } else if (n.type === 'REFUND') {
                    icon = 'fa-reply-all';
                    iconColor = '#e67e22';
                }
                
                const dateStr = n.date ? new Date(n.date).toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : 'Recently';

                return `
                    <div style="background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; gap: 1.5rem; align-items: flex-start; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                        <div style="font-size: 2rem; color: ${iconColor};">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div style="flex: 1;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                <h4 style="margin: 0; font-size: 1.1rem; color: var(--text-dark);">${n.title}</h4>
                                <span style="font-size: 0.8rem; color: var(--text-muted);"><i class="fas fa-clock"></i> ${dateStr}</span>
                            </div>
                            <p style="margin: 0 0 0.8rem 0; color: var(--text); line-height: 1.5;">
                                ${n.message}
                            </p>
                            <div style="font-size: 0.85rem; color: var(--primary); font-weight: 600;">
                                Event: ${n.eventName}
                            </div>
                        </div>
                        <div>
                            ${n.eventId ? `<button onclick="window.location.href='event-details.html?eventId=${n.eventId}'" class="btn btn-outline" style="padding: 0.5rem 1rem; border-radius: 50px; font-size: 0.85rem;">View Event</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
