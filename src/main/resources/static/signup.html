<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Ethereal Weddings</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 0;
        }
        .signup-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .signup-card h2 {
            margin-bottom: 10px;
            font-size: 32px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="signup-card">
        <a href="index.html" class="logo" style="display: block; margin-bottom: 20px;">ETHEREAL</a>
        <h2>Join Us</h2>
        <p>Create an account to start your journey.</p>
        
        <form id="signupForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label>I am a...</label>
                <select id="role" onchange="toggleCustomerFields()">
                    <option value="CUSTOMER">Customer (Planning a wedding)</option>
                    <option value="VENDOR">Vendor (Providing a service)</option>
                </select>
            </div>

            <!-- Customer Specific Fields -->
            <div id="customerFields">
                <div class="form-group">
                    <label>Title</label>
                    <select id="title">
                        <option value="Mr.">Mr.</option>
                        <option value="Mrs.">Mrs.</option>
                        <option value="Ms.">Ms.</option>
                        <option value="Miss">Miss</option>
                        <option value="Dr.">Dr.</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Your Role in Wedding</label>
                    <select id="customerRole">
                        <option value="BRIDE">Bride</option>
                        <option value="GROOM">Groom</option>
                        <option value="PLANNER">Wedding Planner</option>
                        <option value="FAMILY">Family Member</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Partner/Other Party Name</label>
                    <input type="text" id="otherPartyName" placeholder="Enter partner's name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter phone number">
                </div>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; margin-top: 10px;">Create Account</button>
        </form>
        
        <div style="margin-top: 20px; font-size: 14px;">
            Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Login</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        function toggleCustomerFields() {
            const role = document.getElementById('role').value;
            const customerFields = document.getElementById('customerFields');
            customerFields.style.display = role === 'CUSTOMER' ? 'block' : 'none';
        }

        // Initialize fields on page load
        window.onload = toggleCustomerFields;

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const data = {
                username: document.getElementById('username').value,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: role
            };

            if (role === 'CUSTOMER') {
                data.title = document.getElementById('title').value;
                data.customerRole = document.getElementById('customerRole').value;
                data.otherPartyName = document.getElementById('otherPartyName').value;
                data.phone = document.getElementById('phone').value;
            }

            const btn = e.target.querySelector('button');
            btn.innerText = 'Creating Account...';
            btn.disabled = true;

            try {
                if (role === 'CUSTOMER') {
                    await api.customers.register(data);
                } else {
                    await api.vendors.register(data);
                }
                alert('Account Created Successfully! Please login.');
                window.location.href = 'login.html';
            } catch (error) {
                alert('Sign Up Failed: ' + error.message);
                btn.innerText = 'Create Account';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
