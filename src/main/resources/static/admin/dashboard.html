<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Ethereal Weddings</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
            gap: 1rem;
        }

        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .profile-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="sidebar-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-header">
            <h1 class="brand-font sidebar-logo">Ethereal</h1>
            <span style="font-size:0.7rem;color:var(--primary);letter-spacing:2px;">
                ADMINISTRATOR
            </span>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-item active">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>

            <a href="vendors.html" class="sidebar-item">
                <i class="fas fa-store"></i> Vendors
            </a>

            <a href="customers.html" class="sidebar-item">
                <i class="fas fa-users"></i> Customers
            </a>

            <a href="bookings.html" class="sidebar-item">
                <i class="fas fa-book"></i> Bookings
            </a>

            <a href="finance.html" class="sidebar-item">
                <i class="fas fa-money-bill-wave"></i> Finance
            </a>

            <a href="categories.html" class="sidebar-item">
                <i class="fas fa-tags"></i> Categories
            </a>
        </nav>

        <div style="padding:1.5rem;border-top:1px solid rgba(255,255,255,0.1);">
            <a href="#" onclick="logout()" class="sidebar-item" style="color:red;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOP HEADER -->
        <header class="top-header">

            <h2 class="brand-font">Admin Overview</h2>

            <div
                id="adminProfileTrigger"
                style="display:flex;align-items:center;gap:1rem;cursor:pointer;"
                onclick="openAdminProfileModal()"
            >
                <span id="adminName">Administrator</span>

                <div class="profile-avatar">
                    <span id="adminInitial">A</span>
                </div>
            </div>

        </header>

        <!-- KPI -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.5rem;margin-bottom:2rem;">

            <div class="card stat-card">
                <span class="stat-label">Total Customers</span>
                <span class="stat-value" id="totalCustomers">0</span>
            </div>

            <div class="card stat-card">
                <span class="stat-label">Vendors (Pending)</span>
                <span class="stat-value" id="vendorStats">0 / 0</span>
            </div>

            <div class="card stat-card">
                <span class="stat-label">Active Bookings</span>
                <span class="stat-value" id="activeBookings">0</span>
            </div>

            <div class="card stat-card">
                <span class="stat-label">Revenue</span>
                <span class="stat-value" id="totalRevenue">LKR 0</span>
            </div>

        </div>

        <!-- CHART -->
        <div class="card">
            <h3 class="brand-font mb-2">Revenue Overview</h3>
            <canvas id="revenueChart"></canvas>
        </div>

    </main>
</div>

<!-- PROFILE MODAL -->
<div
    class="modal-overlay"
    id="adminProfileModal"
    onclick="if(event.target === this) closeAdminProfileModal()"
>
    <div class="modal-card" style="max-width:620px;">

        <!-- Header -->
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--border,#eee);">
            <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#b7935e,#8a6840);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;flex-shrink:0;" id="modalAdminAvatar">A</div>
            <div>
                <h2 class="brand-font" style="margin:0;font-size:1.4rem;">Admin Profile</h2>
                <span style="font-size:0.8rem;color:#888;letter-spacing:1px;text-transform:uppercase;">Edit your account details</span>
            </div>
            <button
                type="button"
                onclick="closeAdminProfileModal()"
                style="margin-left:auto;border:none;background:none;font-size:1.5rem;cursor:pointer;color:#aaa;line-height:1;"
            >&times;</button>
        </div>

        <form id="adminProfileForm">

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="profileName" class="form-control" required placeholder="Enter full name" />
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="profileUsername" class="form-control" required placeholder="Enter username" />
                </div>

                <div class="form-group" style="grid-column:1/-1;">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="profileEmail" class="form-control" required placeholder="Enter email" />
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="profilePassword" class="form-control" placeholder="Current password shown — edit to change" />
                </div>

                <div class="form-group">
                    <label class="form-label">Role</label>
                    <input type="text" id="profileRole" class="form-control" readonly style="background:#f5f5f5;cursor:not-allowed;" />
                </div>

            </div>

            <div class="btn-row" style="margin-top:1.5rem;">
                <button type="button" class="btn btn-outline" onclick="closeAdminProfileModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" id="adminProfileSaveBtn">Save Changes</button>
            </div>

        </form>

    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/components.js"></script>
<script src="../js/main.js?v=2"></script>

<script>

    const user = requireAuth(['ADMIN']);

    // =========================
    // INITIAL LOAD
    // =========================

    document.addEventListener('DOMContentLoaded', async () => {

        if (!user) return;

        loadAdminHeader();

        try {

            showLoader();

            const [
                customers,
                vendors,
                bookings,
                finance
            ] = await Promise.all([
                api.get('/customers'),
                api.get('/vendors'),
                api.get('/bookings'),
                api.get('/finance')
            ]);

            document.getElementById('totalCustomers').innerText = customers.length;

            const pendingVendors = vendors.filter(v => v.status === 'PENDING').length;

            document.getElementById('vendorStats').innerText =
                `${vendors.length} (${pendingVendors})`;

            document.getElementById('activeBookings').innerText =
                bookings.filter(b => b.status === 'CONFIRMED').length;

            const totalIncome = finance
                .filter(f => f.type === 'INCOME')
                .reduce((sum, f) => sum + f.amount, 0);

            document.getElementById('totalRevenue').innerText =
                formatLKR(totalIncome);

            renderRevenueChart(finance);

        } catch (error) {

            console.error(error);
            showToast('Failed to load dashboard', 'error');

        } finally {

            hideLoader();

        }

    });

    // =========================
    // LOAD HEADER
    // =========================

    function loadAdminHeader() {

        document.getElementById('adminName').innerText =
            user.name || 'Administrator';

        document.getElementById('adminInitial').innerText =
            (user.name || 'A').charAt(0).toUpperCase();
    }

    // =========================
    // OPEN MODAL
    // =========================

    async function openAdminProfileModal() {

        try {

            showLoader();

            const admin = await api.get(`/admins/${user.id}`);

            document.getElementById('profileName').value     = admin.name     || '';
            document.getElementById('profileUsername').value = admin.username  || '';
            document.getElementById('profileEmail').value    = admin.email     || '';
            document.getElementById('profileRole').value     = admin.role      || 'ROLE_ADMIN';
            // Pre-fill password from DB so the field shows the current value
            document.getElementById('profilePassword').value = admin.password  || '';

            // Update avatar initial in modal header
            document.getElementById('modalAdminAvatar').innerText =
                (admin.name || 'A').charAt(0).toUpperCase();

            document.getElementById('adminProfileModal').style.display = 'flex';

        } catch (error) {

            console.error(error);
            showToast('Failed to load admin profile', 'error');

        } finally {

            hideLoader();

        }

    }

    // =========================
    // CLOSE MODAL
    // =========================

    function closeAdminProfileModal() {

        document.getElementById('adminProfileModal').style.display = 'none';

    }

    // =========================
    // UPDATE ADMIN
    // =========================

    document.getElementById('adminProfileForm')
        .addEventListener('submit', saveAdminProfileChanges);

    async function saveAdminProfileChanges(event) {

        event.preventDefault();

        const saveBtn = document.getElementById('adminProfileSaveBtn');
        if (saveBtn) { saveBtn.disabled = true; saveBtn.innerText = 'Saving...'; }

        try {

            showLoader();

            const passwordVal = document.getElementById('profilePassword').value.trim();

            const payload = {
                name:     document.getElementById('profileName').value.trim(),
                username: document.getElementById('profileUsername').value.trim(),
                email:    document.getElementById('profileEmail').value.trim(),
                role:     document.getElementById('profileRole').value,
                // Only send password if it is not blank
                ...(passwordVal ? { password: passwordVal } : {})
            };

            const updatedAdmin = await api.put(`/admins/${user.id}`, payload);

            // Sync localStorage
            const storedUser = JSON.parse(localStorage.getItem('ethereal_user'));
            storedUser.name     = updatedAdmin.name;
            storedUser.username = updatedAdmin.username;
            storedUser.email    = updatedAdmin.email;
            localStorage.setItem('ethereal_user', JSON.stringify(storedUser));

            // Refresh UI header
            document.getElementById('adminName').innerText = updatedAdmin.name;
            document.getElementById('adminInitial').innerText =
                updatedAdmin.name.charAt(0).toUpperCase();
            if (document.getElementById('modalAdminAvatar')) {
                document.getElementById('modalAdminAvatar').innerText =
                    updatedAdmin.name.charAt(0).toUpperCase();
            }

            showToast('Admin profile updated successfully', 'success');
            closeAdminProfileModal();

        } catch (error) {

            console.error(error);
            showToast('Failed to update admin profile', 'error');

        } finally {

            hideLoader();
            if (saveBtn) { saveBtn.disabled = false; saveBtn.innerText = 'Save Changes'; }

        }

    }

    // =========================
    // CHART
    // =========================

    function renderRevenueChart(finance) {

        const ctx = document
            .getElementById('revenueChart')
            .getContext('2d');

        const months = [];

        for (let i = 5; i >= 0; i--) {

            const d = new Date();

            d.setMonth(d.getMonth() - i);

            months.push(
                d.toLocaleString('default', { month: 'short' })
            );

        }

        const incomeData = new Array(6).fill(0);
        const expenseData = new Array(6).fill(0);

        finance.forEach(f => {

            const fDate = new Date(f.transactionDate);

            const month =
                fDate.toLocaleString('default', { month: 'short' });

            const idx = months.indexOf(month);

            if (idx !== -1) {

                if (f.type === 'INCOME') {
                    incomeData[idx] += f.amount;
                }

                if (f.type === 'EXPENSE') {
                    expenseData[idx] += f.amount;
                }

            }

        });

        new Chart(ctx, {

            type: 'bar',

            data: {

                labels: months,

                datasets: [
                    {
                        label: 'Income',
                        data: incomeData,
                        backgroundColor: '#C9A96E'
                    },
                    {
                        label: 'Expense',
                        data: expenseData,
                        backgroundColor: '#2C2C2C'
                    }
                ]

            }

        });

    }

</script>

</body>
</html>
