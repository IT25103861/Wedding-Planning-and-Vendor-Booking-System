<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Customers | Ethereal Weddings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="sidebar-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-font sidebar-logo">Ethereal</h1>
                <span style="font-size: 0.7rem; color: var(--primary); letter-spacing: 2px;">ADMINISTRATOR</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-item" data-page="dashboard">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </a>
                <a href="vendors.html" class="sidebar-item" data-page="vendors">
                    <i class="fas fa-store"></i> Vendors
                </a>
                <a href="customers.html" class="sidebar-item active" data-page="customers">
                    <i class="fas fa-users"></i> Customers
                </a>
                <a href="bookings.html" class="sidebar-item" data-page="bookings">
                    <i class="fas fa-book"></i> Bookings
                </a>
                <a href="finance.html" class="sidebar-item" data-page="finance">
                    <i class="fas fa-money-bill-wave"></i> Finance
                </a>
                <a href="categories.html" class="sidebar-item" data-page="categories">
                    <i class="fas fa-tags"></i> Categories
                </a>
                <a href="reviews.html" class="sidebar-item" data-page="reviews">
                    <i class="fas fa-star"></i> Reviews
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="#" onclick="logout()" class="sidebar-item" style="color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2 class="brand-font">Customer Management</h2>
            </header>

            <div class="card">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Contact</th>
                                <th>Role</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customersTable">
                            <!-- Data injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const user = requireAuth(['ADMIN']);

        document.addEventListener('DOMContentLoaded', loadCustomers);

        async function loadCustomers() {
            showLoader();
            try {
                const customers = await api.get('/customers');
                renderCustomers(customers);
            } catch (e) {
                showToast('Failed to load customers', 'error');
            } finally {
                hideLoader();
            }
        }

        function renderCustomers(customers) {
            const tableBody = document.getElementById('customersTable');
            if (customers.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No customers registered yet.</td></tr>';
                return;
            }

            tableBody.innerHTML = customers.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>
                        <div style="font-weight: 600;">${c.title ? c.title + '. ' : ''}${c.name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">@${c.username}</div>
                    </td>
                    <td>
                        <div style="font-size: 0.85rem;">${c.email}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${c.phone}</div>
                    </td>
                    <td><span class="badge" style="background: #E1F5FE; color: #0277BD;">${c.customerRole || 'CLIENT'}</span></td>
                    <td>${formatDate(c.createdAt || new Date())}</td>
                    <td>
                        <button onclick="deleteCustomer(${c.id})" class="btn" style="color: var(--danger);"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteCustomer(id) {
            if (!id || isNaN(id)) {
                console.error('Invalid ID provided to deleteCustomer:', id);
                showToast('Invalid customer selection.', 'error');
                return;
            }

            confirmModal('Are you sure you want to delete this customer account permanently?', async () => {
                showLoader();
                try {
                    await api.delete(`/customers/${id}`);
                    showToast('Customer deleted', 'success');
                    loadCustomers();
                } catch (e) { showToast('Failed to delete customer', 'error'); }
                finally { hideLoader(); }
            });
        }
    </script>
</body>
</html>
