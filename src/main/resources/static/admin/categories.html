<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories | Ethereal Weddings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="sidebar-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-font sidebar-logo">Ethereal</h1>
                <span style="font-size: 0.7rem; color: var(--primary); letter-spacing: 2px;">ADMINISTRATOR</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-item" data-page="dashboard">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </a>
                <a href="vendors.html" class="sidebar-item" data-page="vendors">
                    <i class="fas fa-store"></i> Vendors
                </a>
                <a href="customers.html" class="sidebar-item" data-page="customers">
                    <i class="fas fa-users"></i> Customers
                </a>
                <a href="bookings.html" class="sidebar-item" data-page="bookings">
                    <i class="fas fa-book"></i> Bookings
                </a>
                <a href="finance.html" class="sidebar-item" data-page="finance">
                    <i class="fas fa-money-bill-wave"></i> Finance
                </a>
                <a href="categories.html" class="sidebar-item active" data-page="categories">
                    <i class="fas fa-tags"></i> Categories
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="#" onclick="logout()" class="sidebar-item" style="color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2 class="brand-font">Category Management</h2>
                <button id="addCatBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> New Category
                </button>
            </header>

            <div class="card">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Category Name</th>
                                <th>Description</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoriesTable">
                            <!-- Data injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Category Modal -->
    <div class="modal-overlay" id="catModal">
        <div class="modal-card">
            <h3 class="brand-font mb-2" id="modalTitle">New Category</h3>
            <form id="catForm">
                <div class="form-group">
                    <label class="form-label">Category Name</label>
                    <input type="text" id="catName" class="form-control" placeholder="e.g. Floral Decor" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="catDesc" class="form-control" rows="3" placeholder="Briefly describe this service category..." required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Category Image / Banner</label>
                    <input type="file" id="catPhoto" class="form-control" accept="image/*">
                </div>
                
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Category</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js?v=2"></script>
    <script>
        const user = requireAuth(['ADMIN']);
        const catModal = document.getElementById('catModal');
        const catForm = document.getElementById('catForm');
        let editingCatId = null;

        document.addEventListener('DOMContentLoaded', loadCategories);

        async function loadCategories() {
            showLoader();
            try {
                const categories = await api.get('/categories');
                renderCategories(categories);
            } catch (e) {
                showToast('Failed to load categories', 'error');
            } finally {
                hideLoader();
            }
        }

        function getCategoryImage(categoryId) {
            const local = localStorage.getItem(`cat_image_${categoryId}`);
            if (local) return local;

            const defaultImages = {
                1: 'https://images.unsplash.com/photo-1519167758481-83f550bb49b3?q=80&w=600&auto=format&fit=crop', // Venue
                2: 'https://images.unsplash.com/photo-1523438885200-e635ba2c371e?q=80&w=600&auto=format&fit=crop', // Decor
                3: 'https://images.unsplash.com/photo-1555244162-803834f70033?q=80&w=600&auto=format&fit=crop', // Catering
                4: 'https://images.unsplash.com/photo-1537633552985-df8429e8048b?q=80&w=600&auto=format&fit=crop', // Photo
                5: 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=600&auto=format&fit=crop', // Music
                6: 'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=600&auto=format&fit=crop', // Religious
                7: 'https://images.unsplash.com/photo-1591555268485-a1a17f8b2938?q=80&w=600&auto=format&fit=crop', // Bridal
                8: 'https://images.unsplash.com/photo-1469371670807-013ccf25f16a?q=80&w=600&auto=format&fit=crop', // Planning
                9: 'https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=600&auto=format&fit=crop', // Transport
                10: 'https://images.unsplash.com/photo-1531266752426-aad472b7bbf4?q=80&w=600&auto=format&fit=crop', // Special Effects
                11: 'https://images.unsplash.com/photo-1607344645866-009c320c5ab8?q=80&w=600&auto=format&fit=crop'  // Invitation
            };
            return defaultImages[categoryId] || '../assets/images/placeholder.jpg';
        }

        function renderCategories(categories) {
            const tableBody = document.getElementById('categoriesTable');
            if (categories.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No categories defined yet.</td></tr>';
                return;
            }

            tableBody.innerHTML = categories.map(c => {
                const finalImg = getCategoryImage(c.categoryId);

                return `
                    <tr>
                        <td>#${c.categoryId}</td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 1rem;">
                                <img src="${finalImg}" onerror="this.src='../assets/images/placeholder.jpg'" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border);" />
                                <div style="font-weight: 600;">${c.categoryName}</div>
                            </div>
                        </td>
                        <td><div style="font-size: 0.85rem; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${c.description}</div></td>
                        <td>${formatDate(c.createdAt || new Date())}</td>
                        <td>
                            <div style="display: flex; gap: 0.5rem;">
                                <button onclick='openEditModal(${JSON.stringify(c).replace(/'/g, "&#39;")})' class="btn btn-outline" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">Edit</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        document.getElementById('addCatBtn').onclick = () => {
            editingCatId = null;
            catForm.reset();
            document.getElementById('modalTitle').innerText = 'New Category';
            catModal.style.display = 'flex';
        };

        function openEditModal(c) {
            editingCatId = c.categoryId;
            document.getElementById('modalTitle').innerText = 'Edit Category';
            document.getElementById('catName').value = c.categoryName;
            document.getElementById('catDesc').value = c.description;
            catModal.style.display = 'flex';
        }

        function closeModal() {
            catModal.style.display = 'none';
        }

         catForm.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            utils.setLoading(btn, true, 'Saving...');

            const payload = {
                categoryName: document.getElementById('catName').value,
                description: document.getElementById('catDesc').value
            };

            try {
                let response;
                if (editingCatId) {
                    response = await api.put(`/categories/${editingCatId}`, payload);
                    showToast('Category updated!', 'success');
                } else {
                    response = await api.post('/categories', payload);
                    showToast('Category created!', 'success');
                }

                // If image was selected, save to LocalStorage mapped to this Category ID!
                const fileInput = document.getElementById('catPhoto');
                const finalId = editingCatId || (response ? response.categoryId : null);
                if (finalId && fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        localStorage.setItem(`cat_image_${finalId}`, evt.target.result);
                        loadCategories();
                    };
                    reader.readAsDataURL(file);
                }

                closeModal();
                loadCategories();
            } catch (err) {
                showToast('Operation failed', 'error');
            } finally {
                utils.setLoading(btn, false, 'Save Category');
            }
        };

        async function deleteCategory(id) {
            confirmModal('Are you sure? This might affect existing packages in this category.', async () => {
                showLoader();
                try {
                    await api.delete(`/categories/${id}`);
                    showToast('Category deleted', 'success');
                    loadCategories();
                } catch (e) { showToast('Failed to delete category', 'error'); }
                finally { hideLoader(); }
            });
        }
    </script>
</body>
</html>
